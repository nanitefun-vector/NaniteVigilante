const ctx=document.getElementById("cv").getContext("2d");
// Battlefield backdrop: a soft dark-red vignette (inside a blood vessel)
// instead of flat black. Built once since the canvas size never changes.
const bgGradient=(()=>{
  const g=ctx.createRadialGradient(CFG.W/2,CFG.H/2,80,CFG.W/2,CFG.H/2,Math.max(CFG.W,CFG.H)*.75);
  g.addColorStop(0,"#13050a");g.addColorStop(.55,"#0a0308");g.addColorStop(1,"#030103");
  return g;
})();
function strokePoly(pts,color,w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.stroke();}
function strokeOpenPoly(pts,color,w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();}
// Points for a wavy, whip-like strand from `from` toward `to` - used for the
// boss laser so it reads as an organic tendril rather than a straight beam.
// The wave ramps up over the first stretch so it stays anchored to the boss
// instead of visibly detaching from its body; actual hit detection stays on
// the straight line (b.laserDir), this only changes how it's drawn.
function squigglePoints(from,to,amp,freq,phase){
  const dx=to.x-from.x,dy=to.y-from.y,dist=Math.hypot(dx,dy)||1;
  const ux=dx/dist,uy=dy/dist,px=-uy,py=ux;
  const segs=Math.max(10,Math.floor(dist/16)),pts=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs,d=t*dist,taper=Math.min(1,t*6);
    const off=Math.sin(d*freq+phase)*amp*taper;
    pts.push(V(from.x+ux*d+px*off,from.y+uy*d+py*off));
  }
  return pts;
}
function drawShip(shape,pos,angle,color,scale=1){
  const pts=rotPts(shape,angle).map(p=>V(pos.x+p.x*scale,pos.y+p.y*scale));strokePoly(pts,color);}
function drawParts(parts,pos,angle,color,scale=1,lw=2){
  for(const part of parts){
    const pts=rotPts(part.pts,angle).map(p=>V(pos.x+p.x*scale,pos.y+p.y*scale));
    const pc=part.col||color;
    if(part.closed===false)strokeOpenPoly(pts,pc,lw);else strokePoly(pts,pc,lw);
  }
}
// "Mutated Virus" boss: a circular capsid ringed with irregular spike
// proteins (varied length and a mix of round/petal tips, per the reference
// icon) plus filled genetic-material clusters inside instead of a hollow
// ring, so it reads as a solid organism rather than an empty circle.
function drawMutatedIcon(cx,cy,r,color,dimColor,spin=0){
  const ring=COL.laserWarn; // red outline on the outer capsid + nucleus, matching the red core of the viral genome strand it fires
  const nSpikes=14;
  for(let i=0;i<nSpikes;i++){
    const jig=Math.sin(i*2.3)*6; // deterministic per-spike angle jitter - irregular, not random-flicker
    const rad=((360/nSpikes)*i+spin+jig)*Math.PI/180;
    const lenMult=1+.3*Math.sin(i*1.7+1); // .7x..1.3x length variance
    const roundTip=i%3!==1; // mix of round-ball and petal tips
    const bx=cx+Math.cos(rad)*r,by=cy+Math.sin(rad)*r;
    const spikeLen=r*.32*lenMult;
    const tx=cx+Math.cos(rad)*(r+spikeLen),ty=cy+Math.sin(rad)*(r+spikeLen);
    ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,r*.045);
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
    if(roundTip){ctx.beginPath();ctx.arc(tx,ty,Math.max(1.5,r*.065),0,7);ctx.stroke();}
    else{ctx.save();ctx.translate(tx,ty);ctx.rotate(rad);
      ctx.beginPath();ctx.ellipse(0,0,Math.max(1.6,r*.09),Math.max(1,r*.05),0,0,7);ctx.stroke();
      ctx.restore();}
  }
  ctx.lineWidth=Math.max(2,r*.075);ctx.strokeStyle=ring;
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  // filled genetic-material clusters inside (solid, not hollow), each ringed in red to match the capsid
  const segs=[[-.3,-.25,5,0],[.18,-.3,4,0],[-.15,.2,4.5,0],[.32,.18,4,0],[0,0,5,1],[-.05,-.42,3.5,0]];
  ctx.fillStyle=color;
  for(const[sx,sy,rr0,isBean] of segs){
    const px=cx+sx*r*.82,py=cy+sy*r*.82,rr=Math.max(1.4,r*(rr0/46));
    ctx.beginPath();
    if(isBean)ctx.ellipse(px,py,rr*1.5,rr*.8,sx+sy,0,7);else ctx.arc(px,py,rr,0,7);
    ctx.fill();
    ctx.strokeStyle=ring;ctx.lineWidth=Math.max(.9,r*.028);ctx.stroke();
  }
}
// Influenza-style particle: a spiky ball like the coronavirus, but with
// petal-shaped (not round) spike tips and a few scattered comma/oval shapes
// inside standing in for the segmented RNA genome - used for the boss's
// dropped virion mines (colored to match the boss). The parasite's own
// dropped spore mines use drawAmoebaIcon instead, below.
function drawFluIcon(cx,cy,r,color,dimColor,spin=0){
  const nSpikes=10;
  ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.2,r*.12);
  for(let i=0;i<nSpikes;i++){
    const rad=((360/nSpikes)*i+spin)*Math.PI/180;
    const bx=cx+Math.cos(rad)*r,by=cy+Math.sin(rad)*r;
    const tx=cx+Math.cos(rad)*(r+r*.45),ty=cy+Math.sin(rad)*(r+r*.45);
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.save();ctx.translate(tx,ty);ctx.rotate(rad);
    ctx.beginPath();ctx.ellipse(0,0,Math.max(1.3,r*.16),Math.max(.8,r*.09),0,0,7);ctx.stroke();
    ctx.restore();
  }
  ctx.lineWidth=Math.max(1.5,r*.12);ctx.strokeStyle=color;
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  const segs=[[-.35,-.25,1],[.15,-.35,.6],[-.1,.15,-.3],[.35,.2,1.1],[0,-.05,.2]];
  ctx.strokeStyle=dimColor;ctx.lineWidth=Math.max(1,r*.09);
  for(const[sx,sy,rotv] of segs){
    ctx.save();ctx.translate(cx+sx*r,cy+sy*r);ctx.rotate(rotv);
    ctx.beginPath();ctx.ellipse(0,0,Math.max(1,r*.22),Math.max(.6,r*.1),0,0,7);ctx.stroke();
    ctx.restore();
  }
}

// Amoeba-style blob for the parasite's own dropped spore mines: an irregular
// wobbling membrane with pseudopod bulges and a blobby nucleus/vacuoles
// inside, so these read as a distinct organism from the boss's spiky viral
// mines rather than reusing the same icon.
function drawTardiIcon(cx,cy,r,color,ang,t){ // a tiny tardigrade: scalloped body, four leg pairs, head with a mouth ring
  const L=r*1.35,W=r*.75;ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.lineCap="round";ctx.lineJoin="round";
  for(let k=0;k<4;k++){const x=-L+(k+.5)*L/2,ph=Math.sin(t*1.6+k*1.9)*.35;
    for(const sg of [-1,1]){ctx.beginPath();ctx.moveTo(x,sg*W*.8);ctx.lineTo(x+Math.sin(.4+ph)*r*.5,sg*(W*.8+r*.5));ctx.lineTo(x-r*.3+ph*r*.3,sg*(W*.8+r*.85));ctx.stroke();}}
  ctx.fillStyle="rgba(14,11,6,.9)";ctx.beginPath();
  for(let i=0;i<=24;i++){const u=-1+i/12*(i<=12?1:0),x=i<=12?-L+2*L*i/12:L-2*L*(i-12)/12,e=Math.pow(Math.max(0,1-Math.pow(Math.abs(x/L),2.6)),1/2.6),sc=1+.08*Math.cos(x/L*Math.PI*4),y=(i<=12?-1:1)*W*e*sc;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(L+r*.15,0,r*.28,0,7);ctx.strokeStyle=COL.accent;ctx.stroke();
  ctx.restore();}
function drawWormIcon(cx,cy,r,color,core,ang,t){ // a little segmented worm that wriggles: body of shrinking rings along a travelling sine wave, head with an eye
  const N=7,len0=r*2.1;ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.lineJoin="round";
  const pts=[];for(let i=0;i<N;i++){const u=i/(N-1),x=len0*(.5-u),y=Math.sin(t*1.8-u*5)*r*.4*(.35+u);pts.push([x,y,r*(.46-.26*u*u+(i===0?.08:0))]);}
  ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=r*.6;ctx.lineCap="round";ctx.stroke();
  ctx.strokeStyle=color;ctx.lineWidth=1.6;
  for(let i=N-1;i>=0;i--){const q=pts[i];ctx.fillStyle="rgba(10,6,8,.9)";ctx.beginPath();ctx.arc(q[0],q[1],q[2],0,7);ctx.fill();ctx.stroke();}
  // green star inside the head ring
  const hr=pts[0][2]*.78;ctx.fillStyle=core;ctx.beginPath();
  for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?hr*.42:hr;const X=pts[0][0]+Math.cos(a)*rr,Y=pts[0][1]+Math.sin(a)*rr;k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.closePath();ctx.fill();
  ctx.restore();}
function drawAmoebaIcon(cx,cy,r,color,dimColor,wob=0){
  const n=10,pts=[];
  for(let i=0;i<=n;i++){
    const a=(360/n)*i*Math.PI/180;
    const bulge=1+.24*Math.sin(i*1.9+wob)+.13*Math.sin(i*3.1-wob*1.4);
    pts.push(V(cx+Math.cos(a)*r*bulge,cy+Math.sin(a)*r*bulge));
  }
  strokePoly(pts,color,Math.max(1.5,r*.14));
  ctx.fillStyle=dimColor;
  ctx.beginPath();ctx.ellipse(cx-r*.12,cy+r*.06,r*.34,r*.27,wob*.2,0,7);ctx.fill();
  ctx.strokeStyle=dimColor;ctx.lineWidth=Math.max(1,r*.08);
  ctx.beginPath();ctx.ellipse(cx+r*.36,cy-r*.3,r*.15,r*.12,0,0,7);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx-r*.32,cy-r*.28,r*.12,r*.1,0,0,7);ctx.stroke();
}
function draw(){
  ctx.fillStyle=bgGradient;ctx.fillRect(0,0,CFG.W,CFG.H);
  ctx.save();
  if(G.shakeMag>0.3){
    ctx.translate((Math.random()*2-1)*G.shakeMag,(Math.random()*2-1)*G.shakeMag);
  }
  for(const c of G.cells){ // faint drifting blood cells - deep background, kept dim so it never distracts
    ctx.fillStyle=`rgba(200,50,70,${c.a})`;

  }
  for(const s of G.stars){ // soft hollow dark-red flecks, not bright white "stars"

  else if(G.state==="highscores")drawHighScores();

const INITIAL_CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function cycleChar(cur,dir){const i=INITIAL_CHARS.indexOf(cur);return INITIAL_CHARS[(i+dir+INITIAL_CHARS.length)%INITIAL_CHARS.length];}

function drawWorld(){
  for(const m of G.mines){
    const pr=m.r*(1+.08*Math.sin(m.pulse));
    if(m.source==="parasite"){
      drawWormIcon(m.pos.x,m.pos.y,pr,m.arm<=0?COL.mine_:COL.hudDim,COL.amoebaCore,Math.atan2(m.vel.y,m.vel.x||.01),m.pulse);
    }else if(m.look==="tardi"){
      drawTardiIcon(m.pos.x,m.pos.y,pr*1.05,m.arm<=0?COL.bossTardi:COL.hudDim,Math.atan2(m.vel.y,m.vel.x),m.pulse);
    }else if(m.look==="amoeba"){
      drawAmoebaIcon(m.pos.x,m.pos.y,pr,m.arm<=0?COL.bossAmoeba:COL.hudDim,COL.amoebaCore,m.pulse);
    }else{
      drawFluIcon(m.pos.x,m.pos.y,pr,m.arm<=0?COL.bossMine:COL.hudDim,COL.bossMineCore,m.pulse*25);
    }
  }
  for(const e of G.enemies){
    const parts=e.kind==="kami"?PARTS.kami:e.kind==="gun"?PARTS.gun:PARTS.mine;
    const col=e.kind==="kami"?COL.kami:e.kind==="gun"?COL.gun:(G.stallActive?COL.laserWarn:COL.mine_);
    const anim=e.kind==="kami"?flagellumParts(e.animSeed,G.frame):
      e.kind==="gun"?phageLegParts(e.animSeed,G.frame):parasiteLegParts(e.animSeed,G.frame);
    drawParts(e.kind==="mine"&&G.stallActive?PARTS.mineEnraged:parts,e.pos,e.angle,col);
    drawParts(anim,e.pos,e.angle,col,1,e.kind==="mine"?1.4:2);
  }
  if(G.boss)drawBoss(G.boss);
  if(G.bonus&&G.bonus.wave&&(G.state==="bonuswave"||(G.state==="paused"&&G.pausedFrom==="bonuswave"))){
    for(const tg of G.bonus.wave.targets)if(tg.alive)drawBonusTarget(tg);
  }
  for(const b of G.bullets){
    const col=b.owner==="player"?COL.bullet:COL.bulletE;
    const tl=len(b.vel)>0?sub(b.pos,mul(norm(b.vel),6)):b.pos;
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(b.pos.x,b.pos.y);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.pos.x,b.pos.y,b.r,0,7);ctx.fill();
  }
  for(const m of G.missiles){
    // spinning ninja star that cycles through the colour spectrum (dimmer until armed)
    const spin=G.frame*.55+m.pos.x*.01,hue=(G.frame*9+m.pos.y*.3)%360,star=[];
    for(let k=0;k<8;k++){const a=spin+k*Math.PI/4,rr=k%2?3.2:10;star.push(V(m.pos.x+Math.cos(a)*rr,m.pos.y+Math.sin(a)*rr));}
    ctx.save();ctx.globalAlpha=m.arm<=0?1:.55;ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=m.arm<=0?10:0;
    strokePoly(star,`hsl(${hue},100%,62%)`);ctx.fillStyle=`hsl(${(hue+180)%360},100%,70%)`;ctx.beginPath();ctx.arc(m.pos.x,m.pos.y,1.8,0,7);ctx.fill();ctx.restore();
  }
  for(const ex of G.explosions){
    const prog=1-clamp(ex.life/ex.maxLife,0,1),r=Math.max(1,ex.maxR*prog),a=1-prog;
    const c=Math.floor(255*(.4+.6*a)),c2=Math.floor(180*(.4+.6*a)),c3=Math.floor(60*(.4+.6*a));
    ctx.strokeStyle=`rgb(${c},${c2},${c3})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(ex.pos.x,ex.pos.y,r,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(ex.pos.x,ex.pos.y,Math.max(1,r/3),0,7);ctx.stroke();
  }
  for(const d of G.debris){
    const a=clamp(d.life/d.maxLife,0,1),half=d.len/2;
    const p1=add(d.pos,mul(fwd(d.angle),half)),p2=add(d.pos,mul(fwd(d.angle+180),half));
    ctx.globalAlpha=a;ctx.strokeStyle=d.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    ctx.globalAlpha=1;
  }
  const p=G.player;
  if(p.alive&&!(p.invuln>0&&Math.floor(G.frame/4)%2===0)){
    drawParts(PARTS.player,p.pos,p.angle,COL.player);
    if(p.thrusting){const back=sub(p.pos,mul(fwd(p.angle),9.5)),flick=.6+Math.random()*.7;
      const side=mul(fwd(p.angle+90),(Math.random()*2-1)*3);
      const tip=add(sub(back,mul(fwd(p.angle),10*flick)),side);
      ctx.strokeStyle=COL.flame;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(back.x,back.y);ctx.lineTo(tip.x,tip.y);ctx.stroke();
    }
  }
}

function drawTardigradeBoss(b){
  const tg=b.tongue,col=G.bossRage>0?COL.laserWarn:COL.bossTardi,LEG="#d9a24a",FOLD="#b99552",ACC=COL.accent;
  const pl=(pts,c,lw,close)=>{ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(close!==false)ctx.closePath();ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke();};
  ctx.save();ctx.translate(b.pos.x,b.pos.y);ctx.rotate(b.angle*Math.PI/180);
  const L=80,W=37,SEG=2*L/4,C0=-L+SEG/2,lw=2;
  const eyeP=G.player.alive?angleTo(b.pos,G.player.pos):b.angle,eyeA=(eyeP-b.angle)*Math.PI/180,eyeM=G.player.alive?1:0; // pupils look at your ship
  const env=u=>Math.pow(Math.max(0,1-Math.pow(Math.abs(u),2.6)),1/2.6);
  const hw=x0=>W*env(x0/L)*(1+.065*Math.cos(2*Math.PI*(x0-C0)/SEG));
  const top=[],bot=[];for(let i=0;i<=60;i++){const x0=-L+2*L*i/60;top.push([x0,-hw(x0)]);bot.push([x0,hw(x0)]);}
  const body=top.concat(bot.reverse());
  for(let k=0;k<4;k++){const cx=C0+k*SEG,ph=Math.sin(b.walk*1.2+k*1.9);
    for(const sg of [-1,1]){
      const f1=.3+ph*.14,bb=.8-ph*.12,L1=22,L2=20;
      const hip=[cx,sg*(hw(cx)-3)],v1=[Math.sin(f1),sg*Math.cos(f1)],knee=[hip[0]+v1[0]*L1,hip[1]+v1[1]*L1];
      const v2=[-Math.sin(bb),sg*Math.cos(bb)],foot=[knee[0]+v2[0]*L2,knee[1]+v2[1]*L2];
      const n1=[-v1[1],v1[0]],n2=[-v2[1],v2[0]];
      pl([[hip[0]+n1[0]*10,hip[1]+n1[1]*10],[knee[0]+n1[0]*7,knee[1]+n1[1]*7],[knee[0]-n1[0]*7,knee[1]-n1[1]*7],[hip[0]-n1[0]*10,hip[1]-n1[1]*10]],LEG,lw,false);
      pl([[knee[0]+n2[0]*7,knee[1]+n2[1]*7],[foot[0]+n2[0]*5,foot[1]+n2[1]*5],[foot[0]-n2[0]*5,foot[1]-n2[1]*5],[knee[0]-n2[0]*7,knee[1]-n2[1]*7]],LEG,lw,false);
      for(let q=-1;q<=1;q++){const b0=[foot[0]+n2[0]*q*3.6,foot[1]+n2[1]*q*3.6],ctl=[b0[0]+v2[0]*7,b0[1]+v2[1]*7+q*sg*1.5],end=[b0[0]+v2[0]*10-10,b0[1]+v2[1]*10+q*sg*2.5];
        ctx.beginPath();ctx.moveTo(b0[0],b0[1]);ctx.quadraticCurveTo(ctl[0],ctl[1],end[0],end[1]);ctx.strokeStyle=LEG;ctx.lineWidth=lw*.95;ctx.lineCap="round";ctx.stroke();}}}
  ctx.fillStyle="rgba(14,11,6,.92)";ctx.beginPath();body.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
  pl(body,col,lw*1.25);
  for(let k=1;k<4;k++){const fx=-L+k*SEG,h=hw(fx)*.97,pts=[];for(let i=0;i<=8;i++){const v=i/8*2-1;pts.push([fx+Math.cos(v*1.3)*7-3,v*h]);}pl(pts,FOLD,lw*.8,false);}
  const hx=L-27;ctx.fillStyle="rgba(14,11,6,.95)";ctx.beginPath();ctx.ellipse(hx+8,0,22,22,0,0,7);ctx.fill();
  const hp=[];for(let i=0;i<=14;i++){const a=-1.3+2.6*i/14;hp.push([hx+8+Math.cos(a)*22,Math.sin(a)*22]);}pl(hp,col,lw*1.25,false);
  const glow=tg.state==="windup"?.5+.5*Math.sin(G.frame*.6):0;
  ctx.strokeStyle=glow>0?"#ffd24a":ACC;ctx.lineWidth=lw*(.9+glow);ctx.beginPath();ctx.arc(hx+25,0,8.5+glow*2,0,7);ctx.stroke();
  for(let k=0;k<7;k++){const a=k/7*Math.PI*2;pl([[hx+25+Math.cos(a)*8.5,Math.sin(a)*8.5],[hx+25+Math.cos(a)*5,Math.sin(a)*5]],ACC,lw*.6,false);}
  for(const sg of [-1,1]){pl([[hx+21,sg*18],[hx+32,sg*26],[hx+39,sg*25]],col,lw*.8,false);ctx.strokeStyle="#35ff6a";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(hx+8,sg*13,5,0,7);ctx.stroke();
    ctx.fillStyle="#ff2a2a";ctx.beginPath();ctx.arc(hx+8+Math.cos(eyeA)*2.4*eyeM,sg*13+Math.sin(eyeA)*2.4*eyeM,2,0,7);ctx.fill();}
  ctx.restore();
  // aiming line while it winds up, so the shot can be dodged
  const m0=tardiMouth(b);
  if(tg.state==="windup"&&G.player.alive){ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle="rgba(255,154,46,.35)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m0.x,m0.y);
    const e=add(m0,mul(fwd(b.angle),CFG.tardiReach));ctx.lineTo(e.x,e.y);ctx.stroke();ctx.restore();}
  if(tg.len>2){const tip=tardiTip(b),sp=squigglePoints(m0,tip,3,.07,G.frame*.4);
    strokeOpenPoly(sp,COL.tardiTongue,CFG.tardiW*.8);strokeOpenPoly(sp,"#ffd9a0",3);
    // sticky starfish tip: five tapering arms with a lighter centre, turning slowly
    ctx.save();ctx.translate(tip.x,tip.y);ctx.rotate(G.frame*.04);ctx.beginPath();
    for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?4.5:13;k?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}
    ctx.closePath();ctx.fillStyle="rgba(255,48,48,.6)";ctx.strokeStyle=COL.tardiTip;ctx.lineWidth=2.4;ctx.lineJoin="round";ctx.fill();ctx.stroke();
    ctx.fillStyle="#ffd9a0";for(let k=0;k<5;k++){const a=k*Math.PI*2/5-Math.PI/2;ctx.beginPath();ctx.arc(Math.cos(a)*7,Math.sin(a)*7,1.2,0,7);ctx.fill();}ctx.restore();}
}
function drawAmoebaBoss(b){
  const t=G.frame/60,col=G.bossRage>0?COL.laserWarn:COL.bossAmoeba,pts=[],N=36;
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2,w=1+.09*Math.sin(a*3+t*1.6)+.06*Math.sin(a*5-t*2.1+b.n)+.04*Math.sin(a*2+t*.9);
    pts.push(V(b.pos.x+Math.cos(a)*b.r*w,b.pos.y+Math.sin(a)*b.r*w));}
  // tentacles first, so the body sits over their roots
  for(const tn of b.tents){if(tn.len<=1)continue;const g=tentGeom(b,tn);
    const sp=squigglePoints(g.a,g.b,4,.05,G.frame*.2+tn.seed);
    strokeOpenPoly(sp,col,8);strokeOpenPoly(sp,COL.bossAmoebaLite,3);
    // stag-beetle mandibles: two heavy, toothed horns that sweep out and hook inward, snapping open and shut as the tentacle comes
    const ta=Math.atan2(g.b.y-g.a.y,g.b.x-g.a.x),open=.5+.5*Math.sin(G.frame*.2+tn.seed);
    ctx.save();ctx.translate(g.b.x,g.b.y);ctx.rotate(ta);ctx.scale(.75,.75);ctx.lineJoin="round";ctx.lineWidth=1.8;
    for(const sg of [-1,1]){
      const A=11+15*open,sp=[],hw=u=>5.2*(1-u*.85)+.8;
      for(let i=0;i<=10;i++){const u=i/10;sp.push([3+34*u-8*u*u*open,sg*(4+A*Math.sin(u*Math.PI*.82))]);}
      const nrm=i=>{const a0=sp[Math.max(0,i-1)],a1=sp[Math.min(10,i+1)],dx=a1[0]-a0[0],dy=a1[1]-a0[1],l=Math.hypot(dx,dy)||1;return[-dy/l,dx/l];};
      const outer=[],inner=[];
      for(let i=0;i<=10;i++){const n=nrm(i),w=hw(i/10);outer.push([sp[i][0]+n[0]*w*sg*-1,sp[i][1]+n[1]*w*sg*-1]);inner.push([sp[i][0]+n[0]*w*sg,sp[i][1]+n[1]*w*sg]);}
      const poly=outer.concat(inner.slice().reverse());
      ctx.fillStyle="#1d0b2b";ctx.strokeStyle=col;ctx.beginPath();poly.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle=col;for(const ti of [3,5,7]){const q=inner[ti],n=nrm(ti);ctx.beginPath();ctx.moveTo(q[0]-4,q[1]);ctx.lineTo(q[0]+n[0]*sg*5+1,q[1]+n[1]*sg*5);ctx.lineTo(q[0]+4,q[1]);ctx.fill();}
    }
    ctx.restore();}
  ctx.fillStyle="rgba(8,6,14,.85)";ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fill();
  strokePoly(pts,col,3);
  const off=mul(fwd(b.angle),b.r*.12),c=add(b.pos,off); // nucleus drifts toward you
  ctx.strokeStyle=COL.accent;ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,b.r*.3,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=COL.accent;ctx.beginPath();ctx.arc(c.x,c.y,b.r*.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(178,102,255,.55)";ctx.lineWidth=1.5; // slow-drifting vacuoles
  for(let k=0;k<4;k++){const a=t*.5+k*1.57+b.n,rr=b.r*(.55+.08*Math.sin(t+k)),vr=5+3*((k*7)%3);
    ctx.beginPath();ctx.arc(b.pos.x+Math.cos(a)*rr,b.pos.y+Math.sin(a)*rr,vr,0,Math.PI*2);ctx.stroke();}
}
function drawBoss(b){
  if(b.kind==="tardigrade")drawTardigradeBoss(b);else if(b.kind==="amoeba")drawAmoebaBoss(b);else
  drawMutatedIcon(b.pos.x,b.pos.y,b.r,G.bossRage>0?COL.laserWarn:COL.boss,COL.hudDim,b.angle);
  ctx.lineWidth=3;
  if(b.kind==="virus"&&b.laserState==="warn"){const end=add(b.pos,mul(b.laserDir,1200));
    const fl=.5+.5*Math.abs(Math.sin(performance.now()*.02));
    const pts=squigglePoints(b.pos,end,5,.05,G.frame*.3);
    strokeOpenPoly(pts,`rgba(255,60,60,${fl})`,1);
  }else if(b.kind==="virus"&&b.laserState==="firing"){const end=add(b.pos,mul(b.laserDir,1200));
    const pts=squigglePoints(b.pos,end,CFG.laserW*.9,.055,G.frame*.45);
    strokeOpenPoly(pts,COL.laser,CFG.laserW);
    strokeOpenPoly(pts,COL.laserWarn,Math.max(2,CFG.laserW/3));
  }
  const bw=120,bh=8,x=b.pos.x-bw/2,y=b.pos.y-b.r-22;
  ctx.strokeStyle=COL.hudDim;ctx.lineWidth=1;ctx.strokeRect(x,y,bw,bh);
  const frac=clamp(b.hp/b.maxHp,0,1);if(frac>0){ctx.fillStyle=b.kind==="amoeba"?COL.bossAmoeba:b.kind==="tardigrade"?COL.bossTardi:COL.boss;ctx.fillRect(x+1,y+1,(bw-2)*frac,bh-2);}
}
// Small scrolling EKG under the lives row (top right). Colour tracks the pulse: green while healthy,
// amber on 1 spare life, red on the last life and when flatlined.
function drawEcg(){
  const h=G.heart;if(!h)return;
  const w=160,x0=CFG.W-16-w,y0=36,hh=30,n=h.samples.length; // right edge, just under the row of lives
  const col=h.flat||G.lives<=0?COL.laserWarn:G.lives===1?COL.flame:"#5aff8c";
  ctx.save();
  ctx.strokeStyle="rgba(120,150,160,.22)";ctx.lineWidth=1;ctx.strokeRect(x0+.5,y0+.5,w,hh);
  ctx.beginPath();ctx.rect(x0,y0,w,hh);ctx.clip();
  const base=y0+hh*.68,amp=hh*.58,seg=4,per=Math.ceil(n/seg);
  ctx.lineWidth=1.6;ctx.lineJoin="round";
  for(let s=0;s<seg;s++){ // older samples fade, like a phosphor trace
    ctx.strokeStyle=col;ctx.globalAlpha=.3+.7*(s+1)/seg;
    ctx.beginPath();
    for(let i=s*per;i<=Math.min(n-1,(s+1)*per);i++){
      const px=x0+i/(n-1)*w,py=base-h.samples[i]*amp;
      if(i===s*per)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x0+w-1.5,base-h.samples[n-1]*amp,2.2,0,7);ctx.fill();
  ctx.restore();
}

      ctx.fillStyle=`rgba(255,154,46,${fl})`;ctx.font="bold 24px Consolas,monospace";ctx.fillText("SHOOT THE TONGUE!",CFG.W/2,CFG.H-62);
      ctx.fillStyle=COL.hud;ctx.font="15px Consolas,monospace";ctx.fillText(`BREAK FREE  ${G.boss.tongue.hits} / ${G.boss.grip}   (BULLETS ONLY)`,CFG.W/2,CFG.H-38);ctx.restore();}const tw=ctx.measureText(t).width;

// Draws vector text with a 3D "sign-board" spin: a horizontal squash (never a
// true rotation), so the glyphs' vertical footprint never grows and the title
// can never clip off-canvas, however fast or far it "spins".
function drawSpinTitle(str,cx,cy,scale,color,lw,flipDeg,t){
  const sx=Math.cos(flipDeg*Math.PI/180);
  ctx.save();ctx.translate(cx,cy);ctx.scale(Math.max(.06,Math.abs(sx)),1);
  // Every letter also does its own full 360 turn, alternating clockwise / anticlockwise, all in sync:
  // a 2s eased spin every 6s, so between spins the title reads correctly.
  const ph=((t||0)%6)/2,e=ph<1?ph*ph*(3-2*ph):1;
  const spacing=VFONT_W+1.1,totalW=(str.length*spacing-1.1)*scale;
  for(let i=0;i<str.length;i++){
    if(str[i]===" ")continue;
    ctx.save();ctx.translate((i*spacing-(str.length*spacing-1.1)/2)*scale,0);ctx.rotate((i%2?-1:1)*e*Math.PI*2);
    drawVText(str[i],VFONT_W/2*scale,0,scale,color,lw,0);ctx.restore();
  }
  ctx.restore();
}
function drawMenu(){
  const t=G.menuAnimTime;
  const scalePhase=(Math.sin(t*2*Math.PI/7)+1)/2;      // 0..1 breathing cycle, 7s period: large to small and back
  const titleScale=6.8*(1+0.7*scalePhase);               // ~6.8x .. ~11.6x (longer title name, kept on-canvas at peak)
  const flipDeg=(t*120)%360;                             // continuous sign-board spin, 3s/revolution
  if(HiScores[0]){
    ctx.textAlign="center";ctx.font="bold 14px Consolas,monospace";ctx.fillStyle=COL.hudDim;
    ctx.fillText(`HIGH SCORE   ${HiScores[0].initials}   ${String(HiScores[0].score).padStart(6,"0")}`,CFG.W/2,18);
  }
  drawSpinTitle("NANITE VIGILANTE",CFG.W/2,130,titleScale,COL.player,4,flipDeg,t);

  ctx.textAlign="center";ctx.font="12px Consolas,monospace";ctx.fillStyle=COL.hudDim;
  ctx.fillText("By Vinaude Software",CFG.W/2,192);

  ctx.textAlign="center";ctx.font="13px Consolas,monospace";ctx.fillStyle=COL.hudDim;
  ctx.fillText("Pilot a nanite ship through the bloodstream - save humanity from bio-warfare.",CFG.W/2,212);
  ctx.font="13px Consolas,monospace";
  ctx.fillText("Every 4th zone: a mutated pathogen boss - Virus, Amoeba or Tardigrade.",CFG.W/2,234);

  // Pathogen roster: vector icon, name, description, point value per type.
  const xs=[250,500,750],ry=300;
  for(let i=0;i<ROSTER.length;i++){
    const r=ROSTER[i],cx=xs[i];
    if(r.kind==="boss")drawMutatedIcon(cx,ry,26,r.col,COL.hudDim,t*20);
    else{drawParts(r.parts,V(cx,ry),-90,r.col,r.scale);
      drawParts(r.anim(r.seed,G.frame),V(cx,ry),-90,r.col,r.scale,r.kind==="mine"?1.3:2);}
    ctx.fillStyle=r.col;ctx.font="bold 15px Consolas,monospace";
    ctx.fillText(r.name,cx,ry+68);
    ctx.fillStyle=COL.hudDim;ctx.font="12px Consolas,monospace";
    ctx.fillText(r.desc,cx,ry+88);
    ctx.fillStyle=COL.hud;ctx.font="bold 13px Consolas,monospace";
    ctx.fillText(`${r.sc} PTS`,cx,ry+106);
  }

  // Boss row: the three pathogen bosses, each a small live drawing
  ctx.textAlign="center";ctx.fillStyle=COL.boss;ctx.font="bold 15px Consolas,monospace";
  ctx.fillText("MUTATED PATHOGEN",CFG.W/2,440);
  ctx.fillStyle=COL.hudDim;ctx.font="12px Consolas,monospace";ctx.fillText(`Every 4th zone  -  ${CFG.scBoss} PTS`,CFG.W/2,458);
  const by=512,bxs=[250,500,750];
  drawMutatedIcon(bxs[0],by,30,COL.boss,COL.hudDim,t*20);
  ctx.save();ctx.translate(bxs[1],by);ctx.scale(.46,.46);drawAmoebaBoss({pos:V(0,0),r:62,n:1,angle:t*20,tents:[]});ctx.restore();
  ctx.save();ctx.translate(bxs[2],by);ctx.scale(.4,.4);drawTardigradeBoss({pos:V(0,0),angle:0,n:1,walk:t*3,tongue:{state:"idle",len:0,dir:V(1,0)}});ctx.restore();
  ctx.font="bold 12px Consolas,monospace";
  ctx.fillStyle=COL.boss;ctx.fillText("VIRUS",bxs[0],by+52);ctx.fillStyle=COL.bossAmoeba;ctx.fillText("AMOEBA",bxs[1],by+52);ctx.fillStyle=COL.bossTardi;ctx.fillText("TARDIGRADE",bxs[2],by+52);
  ctx.fillStyle=COL.player;ctx.font="bold 15px Consolas,monospace";
  ctx.fillText(`EXTRA LIFE EVERY ${CFG.extraLifeScore} POINTS`,CFG.W/2,592);

  const lines=["Move: Arrows/WASD/Stick   Thrust: Up/W/Bumper/Touch button",
    "Fire: Space/Button A/Touch   Missile+detonate: Shift/Button B/Touch",
    "Pause: P/Esc     Start: Enter/Start/Tap"];
  let y=624;ctx.font="14px Consolas,monospace";ctx.fillStyle=COL.hud;
  for(const l of lines){ctx.fillText(l,CFG.W/2,y);y+=22;}

  const pulse=.6+.4*Math.abs(Math.sin(t*3));
  ctx.fillStyle=`rgba(80,230,255,${pulse})`;ctx.font="bold 19px Consolas,monospace";
  ctx.fillText("PRESS ENTER / FIRE / TAP TO BEGIN",CFG.W/2,y+16);
  ctx.textAlign="left";
}

// ---------- main loop ----------
resetGame();
// Shows the touch pause pill during a run (label flips to RESUME while paused) and hides it on every other screen.
function syncPauseBtn(canPause){
  const b=document.getElementById("btnPause");if(!b)return;
  const on=Touch.active&&(canPause||G.state==="paused");
  document.body.classList[on?"add":"remove"]("showpause");
  const isP=G.state==="paused";
  if(b.classList.contains("isPaused")!==isP){b.classList.toggle("isPaused",isP);b.setAttribute("aria-label",isP?"Resume":"Pause");}
  // Sit just under the LEVEL title (canvas y~36) - and drop lower while the bonus-round status line or an EXTRA LIFE / enrage banner is on screen, so it never covers them.
  const bonus=G.state==="bonuswave"||(G.state==="paused"&&G.pausedFrom==="bonuswave");
  const units=bonus?58:(G.extraLifeFlash>0||G.stallFlash>0)?70:38;
  if(b._units!==units||b._dirty!==false){
    const cv=document.getElementById("cv"),sc=cv.clientWidth/CFG.W;
    b.style.top=Math.round(cv.getBoundingClientRect().top+units*sc)+"px";b._units=units;b._dirty=false;
  }
}
function autoPause(){ // phone call / app switch / screen lock: stop the world, stay paused until the player resumes
  if(G&&(G.state==="playing"||G.state==="bonuswave")){G.pausedFrom=G.state;G.state="paused";}
}
function update(dt,inp){
  checkLayout();
  updateBackground(dt);
  Hand.setVisible(G.state==="menu"||G.state==="gameover"); // hand-swap pill: title + game-over screens only
  const canPause=G.state==="playing"||G.state==="bonuswave";
  const wantPause=inp.pausePressed||Touch.pauseReq;Touch.pauseReq=false;
  syncPauseBtn(canPause);
  if(wantPause&&(canPause||G.state==="paused")){
    if(G.state==="paused"){G.state=G.pausedFrom||"playing";G.pausedFrom=null;}
    else{G.pausedFrom=G.state;G.state="paused";}
    syncPauseBtn(G.state==="playing"||G.state==="bonuswave");return;
  }
  if(G.hitstopTimer>0){G.hitstopTimer-=dt;dt*=0.15;}
  if(G.state!=="menu"&&G.state!=="paused"){tickEffects(dt);updateHeart(dt);}

  if(G.state==="menu")Snd.musicStart();else Snd.musicStop(); // title theme plays only on the title screen
  if(G.state==="menu"){
    G.menuAnimTime+=dt;
    G.menuTimer+=dt;
    if(G.menuTimer>=(G.menuShowScores?5:20)){G.menuTimer=0;G.menuShowScores=!G.menuShowScores;}
    if(inp.startPressed||inp.firePressed){resetGame();G.state="playing";startLevel(1);}
  }else if(G.state==="playing"){updatePlaying(dt,inp);}
  else if(G.state==="levelclear"){
    G.levelClearTimer-=dt;
    if(G.levelClearTimer<=0){
      if(G.pendingBonusTier)startBonusRound();else startLevel(G.level+1);
    }
  }else if(G.state==="bonusintro"){
    G.bonus.introTimer-=dt;if(G.bonus.introTimer<=0)startBonusWave(0);
  }else if(G.state==="bonuswave"){updateBonusWave(dt,inp);}
  else if(G.state==="bonuswaveresult"){
    G.bonus.resultTimer-=dt;
    if(G.bonus.resultTimer<=0){
      if(G.bonus.waveIndex+1<CFG.bonusWaves)startBonusWave(G.bonus.waveIndex+1);
      else{G.state="bonusfinal";G.bonus.finalTimer=CFG.bonusFinalTime;
        G.player.thrusting=false;Snd.thrustStop();
        if(G.bonus.totalKilled>=CFG.bonusSquadron*CFG.bonusWaves){G.bonus.perfect=true;G.lives++;G.extraLifeFlash=1.6;Snd.bugle();G.bonus.finalTimer=CFG.bonusFinalTime+1.6;}}
    }
  }else if(G.state==="bonusfinal"){
    G.bonus.finalTimer-=dt;
    if(G.bonus.finalTimer<=0){const lvl=G.bonus.returnLevel;G.bonus=null;startLevel(lvl);}
  }else if(G.state==="gameover"){
    G.gameOverAnimTime+=dt;
    const ready=uiReady(inp,dt);
    if(ready&&(inp.startPressed||inp.firePressed)){resetGame();G.state="menu";}
  }else if(G.state==="hsintro"){ // beat of bare background + fanfare before the entry screen, for the "congratulations" feel
    G.hsIntroTimer-=dt;if(G.hsIntroTimer<=0){G.state="enterinitials";lockUi(.6);Snd.highScoreFanfare();}
  }else if(G.state==="enterinitials"){updateEnterInitials(inp,dt);}
  else if(G.state==="highscores"){
    const ready=uiReady(inp,dt);
    if(ready&&(inp.startPressed||inp.firePressed)){resetGame();G.state="menu";}
  }
}
function updateEnterInitials(inp,dt){
  const ready=uiReady(inp,dt);
  if(inp.leftPressed)G.initials[G.initialsIdx]=cycleChar(G.initials[G.initialsIdx],-1);
  if(inp.rightPressed)G.initials[G.initialsIdx]=cycleChar(G.initials[G.initialsIdx],1);
  if(inp.missilePressed&&G.initialsIdx>0)G.initialsIdx--;
  if(ready&&(inp.firePressed||inp.startPressed)){
    if(G.initialsIdx<2)G.initialsIdx++;
    else{G.newHighScoreIdx=addHighScore(G.initials.join(""),G.pendingScore);G.state="highscores";lockUi(.8);}
  }
}
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,1/20);
  G.frame++;
  const inp=pollInput();
  update(dt,inp);
  draw();
  requestAnimationFrame(loop);
}
function resize(){
  const scale=Math.min(window.innerWidth/CFG.W,window.innerHeight/CFG.H);
  const cv=document.getElementById("cv");
  cv.style.width=(CFG.W*scale)+"px";cv.style.height=(CFG.H*scale)+"px";
  // Portrait on a touch device: pin the play area to the top (below the status bar) so the controls get the empty space underneath it.
  const portrait=window.innerHeight>window.innerWidth&&document.body.classList.contains("touchmode");
  document.getElementById("wrap").style.alignItems=portrait?"flex-start":"center";
  cv.style.marginTop=portrait?"calc(env(safe-area-inset-top,0px) + 6px)":"0";
}
function placeMute(){const b=document.getElementById("btnMute"),cv=document.getElementById("cv"),r=cv.getBoundingClientRect(),sc=cv.clientWidth/CFG.W;
  b.style.left=Math.max(8,Math.round(r.left+10*sc))+"px";b.style.top=Math.max(8,Math.round(r.top+30*sc))+"px";}
function syncMute(){const b=document.getElementById("btnMute"),m=Snd.isMuted();
  b.classList.toggle("muted",m);b.setAttribute("aria-label",m?"Unmute sound":"Mute sound");
  b.classList.toggle("hidden",Snd.status()==="unavailable");}
function toggleMute(){Snd.unlock();Snd.setMuted(!Snd.isMuted());syncMute();}
document.getElementById("btnMute").addEventListener("click",e=>{toggleMute();e.preventDefault();});
// Controller in use hides the touch pad; any real touch (outside the small buttons) or unplugging the controller brings it back.
window.addEventListener("touchstart",e=>{if(e.target.closest&&e.target.closest("#btnMute,#btnPause"))return;document.body.classList.remove("padmode");},{passive:true,capture:true});
window.addEventListener("gamepaddisconnected",()=>document.body.classList.remove("padmode"));
// Re-measure everything that is positioned from the canvas (canvas size, mute button, pause button).
// Phones often fire resize/orientationchange BEFORE the new window size is settled, so rotation also
// re-checks a few times afterwards, and a cheap per-frame signature check (checkLayout) catches anything missed.
let _layoutSig="";
function relayout(){document.documentElement.style.setProperty("--k",Math.max(1,Math.min(1.5,Math.min(window.innerWidth,window.innerHeight)/430)).toFixed(3));
  resize();placeMute();const pb=document.getElementById("btnPause");if(pb)pb._dirty=true;
  _layoutSig=layoutSig();}
function layoutSig(){const vv=window.visualViewport;return window.innerWidth+"x"+window.innerHeight+"/"+(vv?Math.round(vv.width)+"x"+Math.round(vv.height):"");}
function checkLayout(){if(layoutSig()!==_layoutSig)relayout();}
window.addEventListener("resize",relayout);
window.addEventListener("orientationchange",()=>{relayout();[80,250,600,1200].forEach(t=>setTimeout(relayout,t));});
if(window.visualViewport)window.visualViewport.addEventListener("resize",relayout);
relayout();syncMute();
document.addEventListener("visibilitychange",()=>{if(document.hidden){autoPause();Snd.musicStop();}});
window.addEventListener("pagehide",autoPause);
document.getElementById("wrap").addEventListener("touchstart",()=>Snd.unlock());
document.getElementById("wrap").addEventListener("click",()=>Snd.unlock());
document.addEventListener("pointerdown",()=>Snd.unlock(),{passive:true});
requestAnimationFrame(loop);
</script>
