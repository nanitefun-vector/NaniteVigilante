<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
/* Self-protection for the public site. The host (InfinityFree) ignores .htaccess, so the protections that can live inside the page are applied here,
   only on the real site address (so previews and local testing are unaffected): a content policy that blocks every outside script, connection,
   frame and form (the game needs none), no referrer sent, and the game blanks itself if another website tries to frame it. */
(function(){if(["nanitevigilante.gamer.gd","nanitevigilante.netlify.app"].indexOf(location.hostname)<0)return;
  function meta(k,v,c){var m=document.createElement("meta");m.setAttribute(k,v);m.content=c;document.head.appendChild(m);}
  meta("http-equiv","Content-Security-Policy","default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'");
  meta("name","referrer","no-referrer");
  try{if(window.top!==window.self)document.documentElement.style.display="none";}catch(e){document.documentElement.style.display="none";}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nanite Vigilante</title>
<style>
  :root{color-scheme:dark;}
  html,body{margin:0;padding:0;background:#05050a;overflow:hidden;height:100%;
    font-family:Consolas,"Courier New",monospace;touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{background:#05050a;image-rendering:crisp-edges;touch-action:none;}
  #touch{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;}
  body.touchmode #touch{display:block;}
  /* Touch layout: everything sits 3/4 of the way down the screen so thumbs rest on it naturally
     when holding the phone with both hands. The stick is centred on that line at the left; the
     three buttons fan out on an arc (about 45 degrees) around a thumb pivot on the right
     (--rp from the right edge, 75% down): THRUST to its left, FIRE up-left, MSL above it. */
  /* --k scales every control with the screen (1 on phones, up to 1.5 on tablets), set from the script in relayout().
     The drawn circles are 12% smaller than their touch areas (the ::before scale) and quite transparent, so they cover less of the game while the
     invisible touch targets keep their full size. */
  :root{--k:1;--rp:calc(44px*var(--k) + env(safe-area-inset-right,0px));--lp:calc(44px*var(--k) + env(safe-area-inset-left,0px));}
  .stick{position:absolute;left:calc(22px*var(--k) + env(safe-area-inset-left,0px));top:calc(75% - 65px*var(--k));width:calc(130px*var(--k));height:calc(130px*var(--k));
    border-radius:50%;pointer-events:auto;}
  .stick::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(80,230,255,.26);transform:scale(.88);pointer-events:none;}
  .knob{position:absolute;left:calc(37px*var(--k));top:calc(37px*var(--k));width:calc(56px*var(--k));height:calc(56px*var(--k));border-radius:50%;
    background:rgba(80,230,255,.2);border:2px solid rgba(80,230,255,.42);transform:scale(.88);pointer-events:none;}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;isolation:isolate;
    justify-content:center;color:rgba(205,221,238,.62);font-weight:bold;font-size:calc(13px*var(--k));}
  .btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:var(--bg);border:2px solid var(--bd);transform:scale(.88);pointer-events:none;}
  .btn.active{color:#fff;}
  .btn.active::before{background:var(--bga);border-color:var(--bda);}
  #btnThrust{--bg:rgba(255,200,60,.13);--bd:rgba(255,200,60,.36);--bga:rgba(255,200,60,.38);--bda:rgba(255,200,60,.85);
    right:calc(var(--rp) + 76px*var(--k));top:calc(75% - 20px*var(--k));width:calc(80px*var(--k));height:calc(80px*var(--k));}
  #btnFire{--bg:rgba(255,235,90,.13);--bd:rgba(255,235,90,.36);--bga:rgba(255,235,90,.38);--bda:rgba(255,235,90,.85);
    right:calc(var(--rp) + 53px*var(--k));top:calc(75% - 113px*var(--k));width:calc(74px*var(--k));height:calc(74px*var(--k));}
  #btnMissile{--bg:rgba(255,150,40,.13);--bd:rgba(255,150,40,.36);--bga:rgba(255,150,40,.38);--bda:rgba(255,150,40,.85);
    right:calc(var(--rp) - 18px*var(--k));top:calc(75% - 151px*var(--k));width:calc(68px*var(--k));height:calc(68px*var(--k));}
  /* Left-handed layout: the whole touch layout mirrored (stick to the right, button arc to the left). */
  body.lefty .stick{left:auto;right:calc(22px*var(--k) + env(safe-area-inset-right,0px));}
  body.lefty #btnThrust{right:auto;left:calc(var(--lp) + 76px*var(--k));}
  body.lefty #btnFire{right:auto;left:calc(var(--lp) + 53px*var(--k));}
  body.lefty #btnMissile{right:auto;left:calc(var(--lp) - 18px*var(--k));}
  /* Hand-swap pill: only shown (on touch devices) on the title and game-over screens - see Hand in the script. */
  #btnHand{display:none;position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);pointer-events:auto;-webkit-appearance:none;appearance:none;
    font:12px Consolas,"Courier New",monospace;color:#9fd8e8;background:rgba(10,20,30,.75);
    border:1px solid rgba(80,230,255,.5);border-radius:14px;padding:6px 14px;white-space:nowrap;}
  body.showhand #btnHand{display:block;}
  /* Pause button: a small round icon (pause bars / play triangle drawn as SVG, no text) at top centre just under the LEVEL / status text,
     touch devices only, shown while a run is playing or paused. The ::before gives it a bigger invisible hit area than it looks. */
  #btnPause{display:none;position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    pointer-events:auto;-webkit-appearance:none;appearance:none;width:calc(34px*var(--k));height:calc(34px*var(--k));padding:0;border-radius:50%;
    color:#cde;background:rgba(10,20,30,.7);border:1px solid rgba(80,230,255,.6);align-items:center;justify-content:center;}
  #btnPause::before{content:"";position:absolute;left:-8px;right:-8px;top:-8px;bottom:-8px;border-radius:50%;}
  #btnPause svg{width:calc(14px*var(--k));height:calc(14px*var(--k));fill:currentColor;pointer-events:none;}
  #btnPause .ico-play{display:none;}
  #btnPause.isPaused .ico-play{display:block;}
  #btnPause.isPaused .ico-pause{display:none;}
  body.showpause #btnPause{display:flex;}
  #btnPause.active{filter:brightness(1.6);}
  /* Mute button: small round speaker icon anchored to the canvas bottom-left (where the old SOUND ON text was); placed by placeMute(). */
  #btnMute{position:fixed;z-index:6;left:10px;top:10px;width:calc(34px*var(--k));height:calc(34px*var(--k));padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;appearance:none;color:#9fd8e8;background:rgba(10,20,30,.7);border:1px solid rgba(80,230,255,.5);cursor:pointer;}
  #btnMute::before{content:"";position:absolute;left:-8px;right:-8px;top:-8px;bottom:-8px;border-radius:50%;}
  #btnMute svg{width:calc(18px*var(--k));height:calc(18px*var(--k));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  #btnMute .ico-off{display:none;}
  #btnMute.muted{color:#ff9a4a;border-color:rgba(255,150,40,.7);}
  #btnMute.muted .ico-on{display:none;}
  #btnMute.muted .ico-off{display:block;}
  #btnMute.hidden{display:none;}
  /* A game controller is in use: hide the on-screen stick and fire/thrust/missile buttons (a touch brings them back). */
  body.padmode .stick,body.padmode #btnThrust,body.padmode #btnFire,body.padmode #btnMissile{display:none;}
  #hint{position:fixed;bottom:6px;width:100%;text-align:center;color:#557;font-size:11px;z-index:6;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1000" height="750"></canvas></div>
<button type="button" id="btnMute" aria-label="Mute sound">
  <svg class="ico-on" viewBox="0 0 18 18"><path d="M2.5 7 H5.5 L9.5 3.5 V14.5 L5.5 11 H2.5 Z"/><path d="M12 6.5 Q14 9 12 11.5"/><path d="M14.3 4.5 Q17.5 9 14.3 13.5"/></svg>
  <svg class="ico-off" viewBox="0 0 18 18"><path d="M2.5 7 H5.5 L9.5 3.5 V14.5 L5.5 11 H2.5 Z"/><path d="M12.5 6.8 L16.5 11.2"/><path d="M16.5 6.8 L12.5 11.2"/></svg>
</button>
<div id="touch">
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="btn" id="btnThrust">THRUST</div>
  <div class="btn" id="btnFire">FIRE</div>
  <div class="btn" id="btnMissile">MSL</div>
  <button type="button" id="btnHand"></button>
  <button type="button" id="btnPause" aria-label="Pause">
    <svg class="ico-pause" viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3.2" height="11" rx=".6"/><rect x="8.3" y="1.5" width="3.2" height="11" rx=".6"/></svg>
    <svg class="ico-play" viewBox="0 0 14 14"><path d="M3.5 1.5 L12 7 L3.5 12.5 Z"/></svg>
  </button>
</div>
<div id="hint"></div>
<script>
"use strict";
const CFG={W:1000,H:750,FPS:60,
  playerR:12,rotSpd:220,thrustAcc:420,maxSpd:340,fric:6,invulnT:2,respawnT:1.2,
  bulSpd:560,bulLife:1.1,bulR:3,bulCd:.14,
  msCount:3,msSpd:300,msLife:3.5,msR:5,blastR:130,msArm:.15,
  kmR:14,kmSpd:120,kmTurn:140,
  gnR:14,gnSpd:90,gnRange:260,gnCd:1.6,gnBulSpd:320,gnHp:2,
  mlR:16,mlSpd:70,mlCd:2.6,mlHp:3,
  mineR:10,mineArm:.6,mineLife:14,
  mineTrackStartD:5,mineTrackFullD:16,mineTrackMaxSpd:110, // parasite spore mines: no homing until diffIndex 5, ramps to full strength by 16, capped well under player's 340 top speed
  bossR:46,bossHp0:140,bossHpTier:60,bossSpd:95,bossHpCapTier:8,bossSpeedMultCap:2.4,
  bulDmgBossFrac:.009,msDmgBossFrac:.25, // bullet/missile damage to the boss, as a fraction of its (capped) max HP
  bossMineTrackStartTier:9,bossMineTrackFullTier:13,bossMineTrackMaxSpd:110, // boss mines pick up the parasite's homing past the HP cap
  laserWarn:.7,laserFire:.6,laserCd:3.2,laserW:14,laserTick:.15,bossMineCd:2.4,
  scK:150,scG:200,scM:175,scMine:50,scBoss:5000,cycle:4,extraLifeScore:8000,
  bossDebris:24,bossHitstop:.12,bossShake:18,bossFinalDelay:.5,bossFinalShake:24,
  // Bonus round: fires after every 2nd tier's boss (tier 2,4,6... i.e. right after
  // levels 8,16,24...). CFG.bonusWaves waves of CFG.bonusSquadron targets each, flown single
  // file along one shared path; no life lost from contact (pure precision/speed
  // bonus, like a classic arcade challenge stage) - see startBonusRound()/updateBonusWave().
  // A wave earns a missile when at least bonusMissilePct of its targets are hit.
  // (4 waves x 20 targets = 80 per round; bonusScorePer is kept low enough that a
  // flawless round, 80 x 90 = 7200, stays under one extra life's worth, extraLifeScore.)
  bonusSquadron:20,bonusWaves:4,bonusSpawnGap:.4,bonusMissilePct:.6,
  bonusIntroTime:2.6,bonusWaveResultTime:1.7,bonusFinalTime:3.4,
  bonusBaseDur:3.8,bonusDurMinMult:.6,bonusDurStep:.07, // later bonus rounds fly their paths faster (shorter duration)
  bonusScorePer:90,bonusLoopAmp:150,bonusZigAmp:70,bonusZigCount:3,
  // Anti-stall: if parasites are the only enemies left on a level, their mines
  // are otherwise free, safe points (the minelayer flees once you're close,
  // so you can farm drops from a distance forever). After stallTime seconds of
  // that condition, parasites stop fleeing and charge. Enraged speed is an absolute
  // stallSpeed (above the player's maxSpd so you can't outrun it) and its turn
  // rate is multiplied by stallTurnMult (so circling it doesn't work either).
  stallTime:30,stallSpeed:390,stallTurnMult:3.5,
  // Boss anti-turtle (tiers below bossMineTrackStartTier only - from there the
  // boss's homing mines already keep up the pressure): once the boss has gone
  // bossStallGrace seconds without taking any damage, it ramps over bossStallRamp
  // seconds to bossStallSpeed extra speed and a bossStallLaser shorter laser
  // cooldown. Any hit on the boss resets it.
  bossStallGrace:15,bossStallRamp:30,bossStallSpeed:.8,bossStallLaser:.55,
  // Amoeba boss: slow tentacles instead of the genome strand. tentSpd = px/s a tentacle extends, tentMax = full reach, tentW = hit width,
  // tentTurn = deg/s a tentacle steers toward you.
  // Tardigrade boss: an armoured body that only its sticky tongue can hurt. tardiReach = tongue length, tardiShoot/tardiRetract = tongue speeds (px/s),
  // tardiWind = aiming wind-up, tardiCd = rest between shots, tardiReel = seconds a stuck ship has before it is reeled to the mouth (shrinks 10% per
  // appearance to tardiReelMin), tardiGrip0..tardiGripMax = bullets on the tongue needed to break free (+1 every 2nd appearance),
  // tardiTongueDmg = a tongue hit does this many times a normal bullet's boss damage.
  tardiMineSpd:55,tardiMineStep:14,tardiMineMax:120,tardiR:60,tardiBodyR:40,tardiReach:520,tardiShoot:640,tardiRetract:820,tardiW:12,tardiWind:.55,tardiCd:2.4,
  tardiReel:2.5,tardiReelMin:1.4,tardiGrip0:6,tardiGripMax:9,tardiTongueDmg:6,
  amoebaR:62,tentSpd:85,tentMax:380,tentW:12,tentTurn:16,
  // Heartbeat + ECG: a background "lub-dub" and a small scrolling EKG trace that
  // speed up as lives run low (see heartBpmFor) and flatline on game over.
  // heartStep = seconds per EKG sample, heartSamples = samples kept on screen.
  heartStep:1/150,heartSamples:360};
const COL={player:"#50e6ff",flame:"#ffc83c",bullet:"#ffeb5a",bulletE:"#ff8282",
  missile:"#ff9628",missileArm:"#ff3c3c",kami:"#5e5ce6",gun:"#ff5adc",mine_:"#aa6eff",
  mine:"#ff6464",mineCore:"#ffd25a",boss:"#ff8c2e",laserWarn:"#ff3c3c",laser:"#ffe63c",
  bossTardi:"#e8c681",tardiTongue:"#ff9a2e",tardiTip:"#ff3030",bossAmoeba:"#b266ff",bossAmoebaLite:"#e3c9ff",bossMine:"#ffa63e",bossMineCore:"#9dff4a",amoebaCore:"#9dff4a",accent:"#9dff4a",
  hud:"#c8e6ff",hudDim:"#78969a",white:"#f0f0f5"};

// ---------- math ----------
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y);
const mul=(a,s)=>V(a.x*s,a.y*s);
const len=a=>Math.hypot(a.x,a.y);
const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l);};
const fwd=deg=>V(Math.cos(deg*Math.PI/180),Math.sin(deg*Math.PI/180));
const dist=(a,b)=>len(sub(a,b));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function shortAngle(cur,tgt){let d=(tgt-cur+180)%360-180;if(d<-180)d+=360;return d;}
function angleTo(a,b){const d=sub(b,a);return Math.atan2(d.y,d.x)*180/Math.PI;}
function wrap(p,m=24){let x=p.x,y=p.y;
  if(x<-m)x=CFG.W+m;else if(x>CFG.W+m)x=-m;
  if(y<-m)y=CFG.H+m;else if(y>CFG.H+m)y=-m;
  return V(x,y);}
function rndEdge(){const s=Math.floor(Math.random()*4),m=40;
  if(s===0)return V(Math.random()*CFG.W,-m);
  if(s===1)return V(Math.random()*CFG.W,CFG.H+m);
  if(s===2)return V(-m,Math.random()*CFG.H);
  return V(CFG.W+m,Math.random()*CFG.H);}
function rotPts(pts,ang){const r=ang*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  return pts.map(p=>V(p[0]*c-p[1]*s,p[0]*s+p[1]*c));}

// ---------- shapes ----------
// Battlefield is the bloodstream: the player pilots a nanite ship fighting off
// pathogens. Each shape is a list of parts (polylines); closed parts stroke as
// a closed loop, open parts as a bare line, so a single "ship" can combine a
// solid hull with wispy, non-closed detail (flagella, phage legs, cilia).
const PARTS={ // static bodies only - animated appendages are generated per-frame below
  player:[ // nanite ship (V44 double-V): slim forked nose with red stripes, small V + big V forward-swept wings, red diamond core, notched tail where the thrust exits. Nose +x; per-part col.
    {pts:[[11.82,0],[12.26,0.24],[13.61,0.56],[15.4,0.85],[15.74,0.97],[15.29,1.13],[13.16,1.61],[10.64,2.34],[8.12,2.58],[5.6,2.54],[3.92,2.1],[2.52,1.61],[1.1,1.5],[2.6,3.09],[3.98,6.33],[0.85,4.73],[-2.2,1.45],[-6.5,1.4],[-1.85,6.42],[1,11.24],[-3.6,8.05],[-9.8,1.4],[-11.8,1.3],[-9.7,0],[-11.8,-1.3],[-9.8,-1.4],[-3.6,-8.05],[1,-11.24],[-1.85,-6.42],[-6.5,-1.4],[-2.2,-1.45],[0.85,-4.73],[3.98,-6.33],[2.6,-3.09],[1.1,-1.5],[2.52,-1.61],[3.92,-2.1],[5.6,-2.54],[8.12,-2.58],[10.64,-2.34],[13.16,-1.61],[15.29,-1.13],[15.74,-0.97],[15.4,-0.85],[13.61,-0.56],[12.26,-0.24]],closed:true,col:"#50e6ff"},
    {pts:[[11.59,1.21],[9.91,1.94],[7.56,2.17],[5.6,2.22],[5.88,1.97],[7.84,1.86],[9.8,1.61],[11.26,1.13]],closed:true,col:"#ff4a4a"},
    {pts:[[11.59,-1.21],[9.91,-1.94],[7.56,-2.17],[5.6,-2.22],[5.88,-1.97],[7.84,-1.86],[9.8,-1.61],[11.26,-1.13]],closed:true,col:"#ff4a4a"},
    {pts:[[1.1,1.2],[2.6,0],[1.1,-1.2],[-0.4,0]],closed:true,col:"#ff4a4a"}],
  kami:[ // "BACTERIUM" - a darting rod-shaped cell; flagellum is animated separately
    {pts:[[14,0],[5,6],[-9,5],[-12,0],[-9,-5],[5,-6]],closed:true},
    {pts:[[-1,2],[2,0],[-1,-2],[-4,0]],closed:true,col:COL.accent}], // nucleoid
  gun:[ // "PHAGE" - classic bacteriophage; leg fibers are animated separately
    {pts:[[14,6],[14,-6],[7,-10],[0,-6],[0,6],[7,10]],closed:true}, // capsid head
    {pts:[[0,-2.5],[0,2.5],[-10,2.5],[-10,-2.5]],closed:true}, // tail sheath
    {pts:[[4.84,2.52],[9.16,2.52],[10.6,0],[9.16,-2.52],[4.84,-2.52],[3.4,0]],closed:true,col:COL.accent}], // lime hexagon core in the head
  mine:[ // "PARASITE" - a slender daddy-long-legs body; legs are animated separately.
         // Same width as before (-4..4), just stretched longer front-to-back.
    {pts:[[-15,-4],[6,-4],[15,0],[6,4],[-15,4],[-18,0]],closed:true},
    {pts:[[-6,0],[-1,-2.2],[4,0],[-1,2.2]],closed:true,col:COL.accent}]}; // + lime core
PARTS.mineEnraged=PARTS.mine.map(p=>({pts:p.pts,closed:p.closed})); // same shape, single color (red) while enraged
// Collision radii for bonus-round targets, reusing each kind's normal-play size
// (amoeba has no normal "enemy" entity - it's only ever drawn for dropped mines -
// so it gets its own radius here, sized like the others).
const BONUS_R={kami:CFG.kmR,gun:CFG.gnR,mine:CFG.mlR,amoeba:13,worm:13,flu:13,tardi:14};

// Animated appendages. `seed` (per-entity, set at spawn) desyncs same-kind
// enemies so a cluster doesn't move in creepy lockstep; `frame` is G.frame,
// which advances every rendered frame regardless of game state.
function flagellumParts(seed,frame){ // bacterium: a whip-like tail, wave growing toward the tip
  const n=5,pts=[[-12,0]];
  for(let i=1;i<=n;i++){
    const t=i/n,x=-12-t*19,amp=1.5+t*3.5;
    pts.push([x,Math.sin(frame*.35+seed+t*5)*amp]);
  }
  return[{pts,closed:false}];
}
function phageLegParts(seed,frame){ // phage: leg fibers undulate like they're treading water
  const osc=ph=>Math.sin(frame*.3+seed+ph)*2.2;
  return[
    {pts:[[-10,-2],[-16,-7+osc(0)],[-20,-5+osc(.6)]],closed:false},
    {pts:[[-10,2],[-16,7+osc(Math.PI)],[-20,5+osc(Math.PI+.6)]],closed:false},
    {pts:[[-10,-1],[-18,-2+osc(1.5)]],closed:false},
    {pts:[[-10,1],[-18,2+osc(1.5+Math.PI)]],closed:false}];
}
function parasiteLegParts(seed,frame){ // parasite: 8 long, spindly "daddy long legs"
  // walking gait - a traveling wave runs front-to-back along each side (a
  // metachronal wave, the way real arthropod legs step in sequence rather
  // than all together), with the two sides a half-cycle out of phase.
  // Each leg has a real knee: the femur juts sharply outward past where the
  // foot ends up, then the tibia angles back in to the foot - a visible bend
  // like a tarantula's leg, rather than one straight line to the foot. Legs
  // stay fairly short relative to the body - they don't need to span its
  // full length, just enough to look spindly and raised off it.
  const xs=[-8,-2,3,8],legs=[];
  for(let side=0;side<2;side++){
    const sgn=side===0?-1:1,hy=sgn*4;
    for(let i=0;i<4;i++){
      const hx=xs[i],dir=i<2?-1:1; // front legs angle fwd, rear legs angle back
      const phase=frame*.26+seed+i*1.3+side*Math.PI;
      const swing=Math.sin(phase);
      const stepX=swing*5,lift=Math.max(0,swing)*3;
      const knee=[hx+dir*9+stepX*.35,hy+sgn*(13-lift*.4)]; // bends out wide
      const foot=[hx+dir*3+stepX,hy+sgn*(25-lift)]; // tucks back in to plant

function measureVText(str,scale){

      if(!ctx||ctx.state!=="running")return"blocked";return"ready";},
    playerShoot(x){ensure();if(!ctx)return; // deep, liquid "bloop" - pitch and a closing lowpass filter both drop together, like a droplet through the bloodstream, instead of a dry arcade blip
      const t=ctx.currentTime;
      const o=ctx.createOscillator();o.type="sine";
      // Lifted out of the heartbeat's 40-80 Hz band: a short, soft, resonant "wet pop"

      o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(95,t+.09);

      const g=ctx.createGain();g.gain.setValueAtTime(.24,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);
      o.connect(f);f.connect(g);out(g,x);o.start(t);o.stop(t+.12);
      noise(.01,.02,.4,x);},
    // Sounds below take the source's screen x so they pan across the stereo field.
    gunnerShoot(x){tone(520,340,.10,.22,"sine",x);},
    mineDrop(boss,x){tone(boss?130:180,boss?60:80,boss?.22:.16,.28,"sine",x);noise(.06,.12,0,x);},
    missileLaunch(x){tone(220,90,.28,.22,"sawtooth",x);noise(.28,.14,.3,x);},
    explSmall(x){noise(.22,.35,.15,x);},
    explMissile(x){noise(.38,.5,.35,x);},
    explMine(x){noise(.28,.4,.25,x);},
    explPlayer(x){noise(.55,.45,.4,x);tone(500,90,.4,.2,"square",x);},
    tongueWind(x){tone(260,380,.5,.1,"sine",x);}, // a rising gurgle as it takes aim
    tongueShoot(x){tone(560,170,.16,.22,"sawtooth",x);noise(.1,.12,0,x);}, // fast wet whip
    tongueStick(x){tone(130,60,.3,.32,"square",x);noise(.12,.16,.3,x);}, // squelchy thud when it grabs you
    tardiPing(x){tone(950,640,.08,.12,"triangle",x);}, // shot or ship bouncing off its armour
    tentacleLaunch(x){tone(170,70,.3,.16,"sine",x);noise(.12,.07,.4,x);}, // wet, low "schlorp" as a tentacle shoots out
    tentacleHit(x){tone(340,110,.13,.22,"triangle",x);noise(.06,.12,0,x);}, // sharp pop as a shot yanks it back
    explBoss(x){noise(.9,.6,.5,x);},
    explBossFinal(x){noise(1.1,.75,.55,x);tone(140,40,.6,.3,"sawtooth",x);},
    laserWarnBeep(){tone(750,750,.1,.26,"square");},
    highScoreFanfare(){ // quick ascending arpeggio - a little "congratulations" riff
      const notes=[523.25,659.25,783.99,1046.5];
      notes.forEach((f,i)=>setTimeout(()=>tone(f,f,.24,.24,"square"),i*110));
    },
    bugle(){ // 7-note cavalry "charge": da-da-da-DAA, da-DA-DAAAH. Square + sawtooth for a brassy tone.
      const seq=[[392,.11,0],[523.25,.11,120],[659.25,.11,240],[783.99,.22,360],[659.25,.11,610],[783.99,.14,730],[783.99,.55,900]];
      seq.forEach(([f,d,t])=>setTimeout(()=>{tone(f,f*1.004,d+.08,.16,"square");tone(f*2,f*2,d+.05,.05,"sawtooth");},t));
    },
    bonusCharge(){ // fast rising "charge up" sting for the bonus round intro - distinct
      // from the held-note high-score fanfare: short, sawtooth, quickening notes.

    },
    stallAlarm(){ // two quick rising alarm beeps - the parasites just stopped fleeing and started hunting
      tone(300,900,.16,.28,"square");setTimeout(()=>tone(300,900,.16,.28,"square"),210);
    },
    heartbeat(kind,stress){ // always-on low "lub" (kind 1) / "dub" (kind 2) thump, kept centered; stress 0..1 makes it louder as lives run low.
      // Each thump carries a faint 2x overtone (triangle) so it still reads on small speakers/phones that can't reproduce 40-80 Hz.
      const v=1+.5*(stress||0);
      if(kind===1){tone(62,34,.14,.35*v,"sine");tone(124,68,.10,.10*v,"triangle");}
      else{tone(80,44,.11,.23*v,"sine");tone(160,88,.08,.07*v,"triangle");}},
    flatline(){ensure();if(!ctx)return; // steady monitor tone that holds, then fades
      const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.setValueAtTime(880,t);
      g.gain.setValueAtTime(.15,t);g.gain.setValueAtTime(.15,t+1.6);g.gain.exponentialRampToValueAtTime(.001,t+1.9);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+1.95);},
    laserLoopStart(){ensure();if(!ctx||laserOsc)return; // "viral genome strand" tone: a low, filtered, wobbling tone - bassy/liquidy rather than a sharp laser zap
      const t=ctx.currentTime;
      laserGain=ctx.createGain();
      laserGain.gain.setValueAtTime(0,t);

      laserFilter.frequency.value=300;laserFilter.Q.value=4.5;
      laserOsc=ctx.createOscillator();laserOsc.type="sine";laserOsc.frequency.value=68;
      laserOsc2=ctx.createOscillator();laserOsc2.type="triangle";laserOsc2.frequency.value=70.5; // slight detune against osc1 for a thick, wet beating tone
      laserLfo=ctx.createOscillator();laserLfo.type="sine";laserLfo.frequency.value=5.5; // slow wobble - the "liquid" gurgle
      const lfoGain=ctx.createGain();lfoGain.gain.value=150; // modulates the filter cutoff
      laserLfo.connect(lfoGain);lfoGain.connect(laserFilter.frequency);
      laserOsc.connect(laserFilter);laserOsc2.connect(laserFilter);
      laserFilter.connect(laserGain);laserGain.connect(master);
      laserOsc.start();laserOsc2.start();laserLfo.start();},
    laserLoopStop(){
      if(laserOsc){
        const o=laserOsc,o2=laserOsc2,lfo=laserLfo,g=laserGain,t=ctx.currentTime;
        try{
          g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(Math.max(g.gain.value,.0001),t);

          o.stop(t+.2);o2.stop(t+.2);lfo.stop(t+.2);

        laserOsc=null;laserOsc2=null;laserLfo=null;laserFilter=null;laserGain=null;
      }
    },
    thrustStart(){ensure();if(!ctx||thrustOsc)return;
      const t=ctx.currentTime;
      thrustGain=ctx.createGain();thrustGain.gain.setValueAtTime(0,t);
      thrustGain.gain.linearRampToValueAtTime(.17,t+.05);
      thrustOsc=ctx.createOscillator();thrustOsc.type="triangle";thrustOsc.frequency.value=72;
      thrustLfo=ctx.createOscillator();thrustLfo.type="sine";thrustLfo.frequency.value=7;

      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      thrustNoise=ctx.createBufferSource();thrustNoise.buffer=buf;thrustNoise.loop=true;
      const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;
      const noiseGain=ctx.createGain();noiseGain.gain.value=.45;
      thrustNoise.connect(lp);lp.connect(noiseGain);noiseGain.connect(thrustGain);
      thrustOsc.connect(thrustGain);thrustGain.connect(master);
      thrustOsc.start();thrustNoise.start();thrustLfo.start();},
    thrustStop(){
      if(thrustOsc){
        const t=ctx.currentTime;
        try{
          thrustGain.gain.cancelScheduledValues(t);
          thrustGain.gain.setValueAtTime(Math.max(thrustGain.gain.value,.0001),t);
          thrustGain.gain.exponentialRampToValueAtTime(.0001,t+.12);
          thrustOsc.stop(t+.14);thrustNoise.stop(t+.14);thrustLfo.stop(t+.14);
        }catch(e){try{thrustOsc.stop();thrustNoise.stop();thrustLfo.stop();}catch(e2){}}
        thrustOsc=null;thrustNoise=null;thrustGain=null;thrustLfo=null;
      }
    }
  };
})();

// ---------- input ----------
const Keys={};
window.addEventListener("keydown",e=>{Keys[e.code]=true;Snd.unlock();if(e.code==="KeyM"&&!e.repeat)toggleMute();});
window.addEventListener("keyup",e=>{Keys[e.code]=false;});

function K(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--k"))||1;} // current control scale (set in relayout)
const Touch={active:false,rot:0,thrust:false,fire:false,missile:false,pauseReq:false};
(function setupTouch(){
  const stick=document.getElementById("stick"),knob=document.getElementById("knob");
  let stickId=null,center=null;
  function isTouchDevice(){return matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0;}
  if(isTouchDevice()){document.body.classList.add("touchmode");Touch.active=true;}
  function stickStart(e){const t=e.changedTouches?e.changedTouches[0]:e;
    stickId=e.changedTouches?e.changedTouches[0].identifier:"mouse";
    const r=stick.getBoundingClientRect();center=V(r.left+r.width/2,r.top+r.height/2);
    stickMove(e);}
  function stickMove(e){if(center===null)return;const t=e.changedTouches?
      [...e.changedTouches].find(tt=>tt.identifier===stickId):e;
    if(!t)return;
    let dx=t.clientX-center.x,dy=t.clientY-center.y;const m=54*K();
    const l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m;}
    knob.style.left=(37*K()+dx)+"px";knob.style.top=(37*K()+dy)+"px";
    Touch.rot=clamp(dx/m,-1,1);} // stick steers only, same as the gamepad analog stick - thrust is the dedicated THRUST button
  function stickEnd(){stickId=null;center=null;Touch.rot=0;
    knob.style.left=(37*K())+"px";knob.style.top=(37*K())+"px";}
  stick.addEventListener("touchstart",e=>{stickStart(e);e.preventDefault();},{passive:false});
  stick.addEventListener("touchmove",e=>{stickMove(e);e.preventDefault();},{passive:false});
  stick.addEventListener("touchend",e=>{stickEnd();e.preventDefault();},{passive:false});
  function bindBtn(id,prop){const el=document.getElementById(id);
    const on=e=>{Touch[prop]=true;el.classList.add("active");Snd.unlock();e.preventDefault();};
    const off=e=>{Touch[prop]=false;el.classList.remove("active");e.preventDefault();};
    el.addEventListener("touchstart",on,{passive:false});
    el.addEventListener("touchend",off,{passive:false});
    el.addEventListener("touchcancel",off,{passive:false});}
  bindBtn("btnThrust","thrust");bindBtn("btnFire","fire");bindBtn("btnMissile","missile");
  // Pause pill: a tap just raises a request flag that update() consumes (same path as P/Esc).
  const pb=document.getElementById("btnPause");
  const ask=e=>{Touch.pauseReq=true;Snd.unlock();e.preventDefault();};
  pb.addEventListener("touchstart",ask,{passive:false});
  pb.addEventListener("click",ask);
})();

// Left/right-handed touch layout. The choice is remembered on the device (localStorage, wrapped
// because it can be blocked) and can be flipped back any time with the pill button, which is only
// visible on the title and game-over screens so a thumb can't hit it mid-game. It only mirrors the
// layout via the body.lefty class (see CSS); input handling is identical either way.
const Hand=(()=>{
  const KEY="nanite_vigilante_hand",btn=document.getElementById("btnHand");
  let lefty=false;
  try{lefty=localStorage.getItem(KEY)==="left";}catch(e){}
  function apply(){
    document.body.classList[lefty?"add":"remove"]("lefty");
    btn.textContent=`CONTROLS: ${lefty?"LEFT":"RIGHT"}-HANDED  -  TAP TO SWITCH`;
  }
  btn.addEventListener("click",e=>{
    lefty=!lefty;
    try{localStorage.setItem(KEY,lefty?"left":"right");}catch(err){}
    apply();Snd.unlock();e.preventDefault();
  });
  apply();
  return{isLefty:()=>lefty,
    setVisible(v){document.body.classList[v?"add":"remove"]("showhand");}};
})();

function pollInput(){
  const s={thrust:false,rotate:0,fire:false,firePressed:false,missile:false,
    missilePressed:false,pausePressed:false,startPressed:false};
  if(Keys.ArrowUp||Keys.KeyW)s.thrust=true;
  if(Keys.ArrowLeft||Keys.KeyA)s.rotate-=1;
  if(Keys.ArrowRight||Keys.KeyD)s.rotate+=1;
  let fireDown=!!Keys.Space,msDown=!!(Keys.ShiftLeft||Keys.ShiftRight),
    pauseDown=!!(Keys.KeyP||Keys.Escape),startDown=!!Keys.Enter;

  const pads=navigator.getGamepads?navigator.getGamepads():[];
  const gp=pads&&pads[0];
  if(gp){
    if(!document.body.classList.contains("padmode")&&(Math.abs(gp.axes[0]||0)>.5||gp.buttons.some(b=>b&&b.pressed)))document.body.classList.add("padmode");
    const ax=gp.axes[0]||0;if(Math.abs(ax)>.25)s.rotate+=clamp(ax,-1,1);
    if(gp.buttons[0]&&gp.buttons[0].pressed)fireDown=true;
    if(gp.buttons[1]&&gp.buttons[1].pressed)msDown=true;
    if((gp.buttons[4]&&gp.buttons[4].pressed)||(gp.buttons[5]&&gp.buttons[5].pressed))s.thrust=true;
    if(gp.buttons[6]&&gp.buttons[6].value>.5)s.thrust=true;
    if(gp.buttons[7]&&gp.buttons[7].value>.5)s.thrust=true;
    if(gp.buttons[9]&&gp.buttons[9].pressed)startDown=true;
    if(gp.buttons[8]&&gp.buttons[8].pressed)pauseDown=true;
  }
  if(Touch.active){
    s.rotate+=Touch.rot;
    if(Touch.thrust)s.thrust=true;if(Touch.fire)fireDown=true;if(Touch.missile)msDown=true;
  }
  s.rotate=clamp(s.rotate,-1,1);
  s.fire=fireDown;s.missile=msDown;
  s.firePressed=fireDown&&!pollInput._pf;s.missilePressed=msDown&&!pollInput._pm;
  s.pausePressed=pauseDown&&!pollInput._pp;s.startPressed=startDown&&!pollInput._ps;
  pollInput._pf=fireDown;pollInput._pm=msDown;pollInput._pp=pauseDown;pollInput._ps=startDown;
  // Edge-detected left/right, used for menu-style discrete steppers (e.g. the
  // high-score initials entry) where a continuous held axis would zip by.
  const leftDown=s.rotate<-.4,rightDown=s.rotate>.4;
  s.leftPressed=leftDown&&!pollInput._pl;s.rightPressed=rightDown&&!pollInput._pr;
  pollInput._pl=leftDown;pollInput._pr=rightDown;
  return s;
}

// Boss rotation: a fixed 3-boss cycle by tier (tier = zone / 4): Virus, Amoeba, Tardigrade, then round again.
const BOSS_ORDER=["virus","amoeba","tardigrade"],BOSS_NAMES={virus:"VIRUS",amoeba:"AMOEBA",tardigrade:"TARDIGRADE"};
function bossKindFor(tier){return BOSS_ORDER[(tier-1)%BOSS_ORDER.length];}
function newBoss(tier){
  const kind=bossKindFor(tier),hpTier=Math.min(tier,CFG.bossHpCapTier),hp=CFG.bossHp0+CFG.bossHpTier*(hpTier-1);
  const b={pos:V(CFG.W/2,140),vel:V(0,0),angle:90,hp,maxHp:hp,tier,kind,r:CFG.bossR,alive:true,
  wanderTimer:0,wanderTarget:V(CFG.W/2,140),
  laserState:"idle",laserTimer:1.5+Math.random()*1.5,laserDir:V(0,1),laserTick:0,
  mineTimer:1+Math.random()*CFG.bossMineCd,pendingMine:null,laserHitPlayer:false};
  if(kind==="amoeba"){
    // n = how many times this boss has appeared (tier 2 -> 1, tier 5 -> 2, ...). Each appearance: more tentacles (3, 4, then 5), faster tentacles, faster body.
    const n=Math.floor((tier-2)/3)+1;
    b.n=n;b.r=CFG.amoebaR;b.spdF=Math.min(1+.1*(n-1),1.8);b.tentF=Math.min(1+.16*(n-1),2.2);b.wanderTimer=.6;
    b.minActive=Math.min(5,2+n); // tentacles kept reaching at once: 3, then 4, then 5. The boss always has 5 slots, so a retracting one never leaves it short
    b.tents=Array.from({length:5},(_,i)=>({state:"idle",timer:.4+i*.6,len:0,max:0,ang:90,fast:false,seed:Math.random()*6.28}));
  }
  if(kind==="tardigrade"){
    // n = how many times it has appeared (tier 3 -> 1, tier 6 -> 2, ...). Each appearance: a quicker tongue and body, a shorter reel-in, and a firmer grip to break.
    const n=Math.floor((tier-3)/3)+1;
    b.n=n;b.r=CFG.tardiR;b.spdF=Math.min(1+.08*(n-1),1.6);b.tf=Math.min(1+.12*(n-1),2);
    b.grip=Math.min(CFG.tardiGripMax,CFG.tardiGrip0+Math.floor((n-1)/2));b.reel=Math.max(CFG.tardiReelMin,CFG.tardiReel*Math.pow(.9,n-1));
    b.walk=0;b.wanderTimer=.8;b.bumpCd=0;b.tongue={state:"idle",timer:1.6,len:0,dir:V(1,0),hits:0,fast:false,pull:0};
  }
  return b;}

// ---------- high scores ----------
// Persisted via localStorage so scores survive between play sessions on the
// same browser/device. localStorage can be unavailable (private browsing,
// or when this page runs inside a sandboxed preview) so every read/write is
// wrapped in try/catch and falls back to an in-memory list for that session.
const HISCORE_KEY="nanite_vigilante_highscores",HISCORE_MAX=8;
const DEFAULT_HISCORES=[["ACE",5000],["VGT",4200],["NAN",3600],["BIO",3000],
  ["RNA",2400],["LAB",1800],["CPU",1200],["XEN",600]].map(([initials,score])=>({initials,score}));
function loadHighScores(){
  try{const raw=localStorage.getItem(HISCORE_KEY);if(raw&&raw.length<20000){const list=JSON.parse(raw);
    if(Array.isArray(list)){const clean=sanitizeScores(list);if(clean.length)return clean;}}}catch(e){}
  return DEFAULT_HISCORES.slice();
}
// Saved scores live in the player's own browser storage and could be edited or corrupted, so never trust them:
// keep only entries with 1-3 letter/digit initials and a sane whole-number score, sorted and capped at HISCORE_MAX.
function cleanInitials(v){return typeof v==="string"?v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,3):"";}
function sanitizeScores(list){
  return list.filter(e=>e&&typeof e==="object").map(e=>({initials:cleanInitials(e.initials)||"???",score:Number(e.score)}))
    .filter(e=>Number.isFinite(e.score)&&e.score>=0&&e.score<=999999999).map(e=>({initials:e.initials,score:Math.floor(e.score)}))
    .sort((a,b)=>b.score-a.score).slice(0,HISCORE_MAX);
}
function saveHighScores(list){try{localStorage.setItem(HISCORE_KEY,JSON.stringify(list));}catch(e){}}
let HiScores=loadHighScores();
function qualifiesForHighScore(score){
  return score>0&&(HiScores.length<HISCORE_MAX||score>HiScores[HiScores.length-1].score);
}
function addHighScore(initials,score){
  const entry={initials:cleanInitials(initials)||"???",score};
  HiScores.push(entry);
  HiScores.sort((a,b)=>b.score-a.score);
  HiScores=HiScores.slice(0,HISCORE_MAX);
  saveHighScores(HiScores);
  return HiScores.indexOf(entry); // -1 if it narrowly missed the cut after the sort
}

    gameOverAnimTime:0,
    bossDeathPending:false,bossDeathTimer:0,bossDeathPos:null,bossDeathRadius:0,
    bonus:null,pendingBonusTier:0,heart:newHeart(),
    stallTimer:0,stallActive:false,stallFlash:0,stallMsg:"",bossIdle:0,bossRage:0};
  G.player.alive=false;
}
function makeStars(n){const a=[];for(let i=0;i<n;i++)a.push({x:Math.random()*CFG.W,y:Math.random()*CFG.H,s:.3+Math.random()*.9});return a;}
// Faint drifting "red blood cell" discs for ambience - large, very low alpha,
// slow-moving. Purely decorative background behind the stars/gameplay.
function makeCells(n){const a=[];for(let i=0;i<n;i++)a.push({x:Math.random()*CFG.W,y:Math.random()*CFG.H,
  r:16+Math.random()*24,vx:(Math.random()*2-1)*7,vy:(Math.random()*2-1)*7,
  rot:Math.random()*Math.PI,a:.035+Math.random()*.05});return a;}
// ---------- heartbeat / ECG ----------
// The pulse is the player's remaining lives: calm at full health, racing on the
// last life, flat once they're gone. One clock (h.tb, seconds since the last
// beat began) drives both the lub-dub sounds and the EKG waveform so they stay in
// sync; it's stepped in fixed CFG.heartStep slices so the narrow R spike is never
// skipped between frames.
function newHeart(){return{tb:0,bpm:62,f1:false,f2:false,acc:0,flat:false,beats:0,
  samples:new Array(CFG.heartSamples).fill(0)};}
function heartBpmFor(lives){return lives>=3?62:lives===2?78:lives===1?100:128;}
function ecgWave(tb){ // P, Q, R, S, T as gaussians in absolute seconds after beat start
  const g=(mu,sg)=>{const x=(tb-mu)/sg;return Math.exp(-x*x/2);};
  return .14*g(.04,.022)-.14*g(.115,.009)+g(.135,.011)-.26*g(.158,.010)+.30*g(.30,.05);
}
function updateHeart(dt){
  const h=G.heart;
  h.flat=G.lives<0;
  h.bpm+=(heartBpmFor(G.lives)-h.bpm)*Math.min(1,dt*1.2);
  const stress=clamp((3-G.lives)/3,0,1);
  h.acc+=dt;
  while(h.acc>=CFG.heartStep){
    h.acc-=CFG.heartStep;
    if(!h.flat){
      h.tb+=CFG.heartStep;
      if(h.tb>=60/h.bpm){h.tb-=60/h.bpm;h.f1=h.f2=false;}
      if(!h.f1&&h.tb>=.135){h.f1=true;h.beats++;Snd.heartbeat(1,stress);}
      if(!h.f2&&h.tb>=.30){h.f2=true;Snd.heartbeat(2,stress);}
    }
    h.samples.shift();h.samples.push(h.flat?0:ecgWave(h.tb));
  }
}
function updateBackground(dt){
  for(const c of G.cells){c.x+=c.vx*dt;c.y+=c.vy*dt;
    if(c.x<-50)c.x=CFG.W+50;else if(c.x>CFG.W+50)c.x=-50;
    if(c.y<-50)c.y=CFG.H+50;else if(c.y>CFG.H+50)c.y=-50;}
}

function startLevel(level){
  G.level=level;G.bullets=[];G.missiles=[];G.mines=[];G.enemies=[];G.boss=null;
  G.stallTimer=0;G.stallActive=false;G.bossIdle=0;G.bossRage=0;
  Snd.laserLoopStop();Snd.thrustStop();G.prevLaserState=null;
  const keepMs=G.player.msLeft;
  respawnPlayer(G.player,V(CFG.W/2,CFG.H/2));
  G.player.msLeft=keepMs; // missiles only refill on losing a life (respawnPlayer), not on every new level
  if(isBossLevel(level)){
    const tier=Math.floor(level/CFG.cycle);
    G.boss=newBoss(tier);G.speedMult=Math.min(1+.05*(tier-1),CFG.bossSpeedMultCap);
  }else{
    const d=diffIndex(level);
    G.speedMult=Math.min(1+.07*(d-1),2.4);
    const kn=Math.min(1+Math.floor(d/2),20),
      gn=Math.min(1+Math.floor((d-1)/3),12),
      mn=Math.min(1+Math.floor((d-1)/4),7);
    for(let i=0;i<kn;i++)G.enemies.push(newEnemy("kami",safeSpawn()));
    for(let i=0;i<gn;i++)G.enemies.push(newEnemy("gun",safeSpawn()));
    for(let i=0;i<mn;i++)G.enemies.push(newEnemy("mine",safeSpawn()));
  }
  G.state="playing";
}

// ---------- update ----------
// Player ship movement/firing, factored out of updatePlaying so the bonus
// round (which has its own update loop, no enemies/mines/boss) can drive the
// same ship physics and shot behavior without duplicating/drifting from it.
function updatePlayerShip(dt,inp){
  const p=G.player;
  p.invuln=Math.max(0,p.invuln-dt);
  if(inp.rotate)p.angle+=inp.rotate*CFG.rotSpd*dt;
  const wasThrusting=p.thrusting;
  p.thrusting=!!inp.thrust;
  if(p.thrusting&&!wasThrusting)Snd.thrustStart();
  else if(!p.thrusting&&wasThrusting)Snd.thrustStop();
  if(p.thrusting){const f=fwd(p.angle);p.vel=add(p.vel,mul(f,CFG.thrustAcc*dt));
    if(len(p.vel)>CFG.maxSpd)p.vel=mul(norm(p.vel),CFG.maxSpd);}
  else{const damp=Math.max(0,1-CFG.fric*dt);p.vel=mul(p.vel,damp);
    if(len(p.vel)<2)p.vel=V(0,0);}
  const stuck=G.boss&&G.boss.kind==="tardigrade"&&G.boss.tongue.state==="stuck";
  if(stuck&&len(p.vel)>70)p.vel=mul(norm(p.vel),70); // stuck on the tongue: thrust only slows the reel-in, it can't beat it
  p.pos=wrap(add(p.pos,mul(p.vel,dt)));
  if(p.cd>0)p.cd-=dt;

  if(inp.fire&&p.cd<=0){p.cd=CFG.bulCd;const f=fwd(p.angle);
    const bpos=add(p.pos,mul(f,p.r+4)),bvel=add(mul(f,CFG.bulSpd),mul(p.vel,.3));
    G.bullets.push(newBullet(bpos,bvel,"player"));Snd.playerShoot(p.pos.x);}
  if(inp.missilePressed){
    if(p.activeMs&&p.activeMs.alive){
      if(p.activeMs.arm<=0)explodeMissile(p.activeMs);
    }else if(p.msLeft>0&&!stuck){ // bullets only while stuck: a missile on the tongue would blow up in your face
      p.msLeft--;const f=fwd(p.angle);
      const mpos=add(p.pos,mul(f,p.r+6)),mvel=add(mul(f,CFG.msSpd),mul(p.vel,.4));
      const m=newMissile(mpos,mvel,p.angle);p.activeMs=m;G.missiles.push(m);Snd.missileLaunch(p.pos.x);
    }
  }
}
function updatePlaying(dt,inp){
  const p=G.player;
  if(p.alive){
    updatePlayerShip(dt,inp);
  }else{
    G.respawnTimer-=dt;
    if(G.respawnTimer<=0&&G.lives>=0)respawnPlayer(p,V(CFG.W/2,CFG.H/2));
  }

  for(const b of G.bullets){b.pos=wrap(add(b.pos,mul(b.vel,dt)));b.life-=dt;if(b.life<=0)b.alive=false;}
  for(const m of G.missiles){if(!m.alive)continue;
    if(m.arm>0)m.arm-=dt;m.pos=wrap(add(m.pos,mul(m.vel,dt)));
    if(len(m.vel)>1)m.angle=Math.atan2(m.vel.y,m.vel.x)*180/Math.PI;
    m.life-=dt;if(m.life<=0)m.alive=false;}
  // Parasite-dropped spore mines gain a gentle homing pull at higher difficulty:
  // none until diffIndex 5, ramping to full (but still sub-player-speed) strength
  // by diffIndex 16.
  const mineTrackT=clamp((diffIndex(G.level)-CFG.mineTrackStartD)/(CFG.mineTrackFullD-CFG.mineTrackStartD),0,1);
  const mineTrackSpd=CFG.mineTrackMaxSpd*mineTrackT;
  // Boss-dropped mines pick up the same kind of homing once the boss's own HP/damage
  // curve has capped out (tier 8) - starting tier 9, ramping to full strength by
  // tier 13, so the fight keeps getting more dangerous even once its health bar stops.
  const bossTier=Math.floor(G.level/CFG.cycle);
  const bossMineTrackT=clamp((bossTier-CFG.bossMineTrackStartTier)/(CFG.bossMineTrackFullTier-CFG.bossMineTrackStartTier),0,1);
  const bossMineTrackSpd=CFG.bossMineTrackMaxSpd*bossMineTrackT;
  for(const mn of G.mines){
    if(mn.arm>0){mn.arm-=dt;}
    else if(p.alive&&(mn.home>0||(mn.source==="parasite"&&mineTrackSpd>0)||(mn.source==="boss"&&bossMineTrackSpd>0))){
      // steer velocity gradually toward the player rather than snapping to face
      // them, so it reads as "drifting toward you" not a locked-on missile.
      const spd=mn.home>0?mn.home:mn.source==="parasite"?mineTrackSpd:bossMineTrackSpd;
      const toP=sub(p.pos,mn.pos),dd=len(toP);
      if(dd>1){
        const desired=mul(toP,spd/dd);
        const turnT=1-Math.pow(.0005,dt);
        mn.vel=add(mn.vel,mul(sub(desired,mn.vel),turnT));
      }
    }
    mn.pos=wrap(add(mn.pos,mul(mn.vel,dt)));
    mn.pulse+=dt*4;mn.life-=dt;if(mn.life<=0)mn.alive=false;
  }

  updateStallTimer(dt);
  for(const e of G.enemies){
    updateEnemy(e,dt);
    if(e.pendingBullet){G.bullets.push(e.pendingBullet);e.pendingBullet=null;Snd.gunnerShoot(e.pos.x);}
    if(e.pendingMine){G.mines.push(e.pendingMine);e.pendingMine=null;Snd.mineDrop(false,e.pos.x);}
  }
  if(G.boss){
    updateBoss(G.boss,dt);
    if(G.boss.pendingMine){G.mines.push(G.boss.pendingMine);G.boss.pendingMine=null;Snd.mineDrop(true,G.boss.pos.x);}
    if(G.boss.laserHitPlayer&&G.player.alive&&G.player.invuln<=0)damagePlayer();
  }
  updateBossLaserSound();

  handleCollisions();
  cleanup();
  checkLevelClear();
}

// Anti-stall: tracks how long "only parasites left" has been true and flips
// G.stallActive once it's held for CFG.stallTime straight - see updateEnemy's
// minelayer branch for what that actually changes (stop fleeing, speed up).
// Any other enemy kind still alive, or the level actually clearing, resets it.
function updateStallTimer(dt){
  const onlyParasites=!G.boss&&G.enemies.length>0&&G.enemies.every(e=>e.kind==="mine");
  if(onlyParasites){
    if(!G.player.alive)return; // clock is paused while you're respawning
    G.stallTimer+=dt;
    if(!G.stallActive&&G.stallTimer>=CFG.stallTime){
      G.stallActive=true;G.stallFlash=2.4;G.stallMsg="PARASITES ENRAGED!";Snd.stallAlarm();
    }
  }else{G.stallTimer=0;G.stallActive=false;}
}
function updateEnemy(e,dt){
  if(e.kind==="kami"){
    if(G.player.alive){const d=sub(G.player.pos,e.pos);
      const tgt=Math.atan2(d.y,d.x)*180/Math.PI,turn=shortAngle(e.angle,tgt);
      const maxT=CFG.kmTurn*G.speedMult*dt;e.angle+=clamp(turn,-maxT,maxT);}
    const sp=CFG.kmSpd*G.speedMult;e.vel=mul(fwd(e.angle),sp);e.pos=wrap(add(e.pos,mul(e.vel,dt)));
  }else if(e.kind==="gun"){
    e.pendingBullet=null;
    if(G.player.alive){const d=sub(G.player.pos,e.pos),dst=len(d);
      const tgt=Math.atan2(d.y,d.x)*180/Math.PI;
      let desired=tgt;
      if(dst>CFG.gnRange+40)desired=tgt;else if(dst<CFG.gnRange-40)desired=tgt+180;else desired=tgt+90;
      const turn=shortAngle(e.angle,desired),maxT=110*G.speedMult*dt;e.angle+=clamp(turn,-maxT,maxT);
      const sp=CFG.gnSpd*G.speedMult;e.vel=mul(fwd(e.angle),sp);e.pos=wrap(add(e.pos,mul(e.vel,dt)));
      e.fireTimer-=dt;
      if(e.fireTimer<=0&&dst<CFG.gnRange+160){
        e.fireTimer=CFG.gnCd/Math.max(1,G.speedMult*.6);
        const f=fwd(tgt),bpos=add(e.pos,mul(f,e.r+4));
        e.pendingBullet=newBullet(bpos,mul(f,CFG.gnBulSpd),"enemy");
      }
    }
  }else{ // minelayer
    e.pendingMine=null;e.wanderTimer-=dt;
    if(e.wanderTimer<=0){e.wanderTimer=1+Math.random()*1.5;e.wanderTarget=Math.random()*360;}
    let desired=e.wanderTarget;
    if(G.player.alive){const d=sub(G.player.pos,e.pos),dst=len(d);
      // Normally it flees once you're close, which is what makes "only parasites
      // left, just farm the mines from a safe distance" possible. Once the stall
      // timer trips (see updateStallTimer), it stops fleeing and charges instead.
      if(G.stallActive)desired=Math.atan2(d.y,d.x)*180/Math.PI;
      else if(dst<150)desired=Math.atan2(d.y,d.x)*180/Math.PI+180;}
    const turn=shortAngle(e.angle,desired),maxT=70*G.speedMult*(G.stallActive?CFG.stallTurnMult:1)*dt;e.angle+=clamp(turn,-maxT,maxT);
    const sp=G.stallActive?CFG.stallSpeed:CFG.mlSpd*G.speedMult;
    e.vel=mul(fwd(e.angle),sp);e.pos=wrap(add(e.pos,mul(e.vel,dt)));
    e.dropTimer-=dt;
    if(e.dropTimer<=0){e.dropTimer=CFG.mlCd/Math.max(1,G.speedMult*.5);e.pendingMine=newMine(e.pos,"parasite");}
  }
}

// Anti-turtle: a boss left undamaged for CFG.bossStallGrace seconds ramps up
// (G.bossRage 0..1 over CFG.bossStallRamp seconds) so hiding to farm its mines
// gets steadily more dangerous. Only below the tier where boss mines start
// homing - from there the fight already escalates on its own.
function updateBossRage(b,dt){
  if(b.tier>=CFG.bossMineTrackStartTier){G.bossIdle=0;G.bossRage=0;return;}
  if(!G.player.alive)return;
  G.bossIdle+=dt;
  const before=G.bossRage;
  G.bossRage=clamp((G.bossIdle-CFG.bossStallGrace)/CFG.bossStallRamp,0,1);
  if(before===0&&G.bossRage>0){G.stallFlash=2.4;G.stallMsg=(BOSS_NAMES[b.kind]||"VIRUS")+" GROWING RESTLESS!";Snd.stallAlarm();}
}
// ---- Tardigrade boss ----
function segClosest(p,a,b){const abx=b.x-a.x,aby=b.y-a.y,l2=abx*abx+aby*aby||1;
  const u=clamp(((p.x-a.x)*abx+(p.y-a.y)*aby)/l2,0,1);return V(a.x+abx*u,a.y+aby*u);}
function tardiBody(b){const f=fwd(b.angle);return{a:sub(b.pos,mul(f,48)),b:add(b.pos,mul(f,56)),r:CFG.tardiBodyR};} // the armoured body is a capsule along its length
function tardiMouth(b){return add(b.pos,mul(fwd(b.angle),80));}
function tardiTip(b){const tg=b.tongue;return tg.state==="stuck"&&G.player.alive?G.player.pos:add(tardiMouth(b),mul(tg.dir,tg.len));}
function tongueHit(b,pt,rad){const tg=b.tongue;if(tg.len<=2)return false;return segDist(pt,tardiMouth(b),tardiTip(b))<=rad+CFG.tardiW/2;}
function hitTongue(b,dmg){const tg=b.tongue;Snd.tentacleHit(b.pos.x);
  if(hitBoss(b,dmg)){killBoss();return;}
  if(tg.state==="stuck")tg.hits++;
  else if(tg.state==="windup"||tg.state==="out"||tg.state==="hold"){tg.state="retract";tg.fast=true;}} // hurt mid-shot: it snaps the tongue back
function updateTardigradeBoss(b,dt){
  const p=G.player,alive=p.alive,tg=b.tongue,rage=G.bossRage;
  b.bumpCd=Math.max(0,b.bumpCd-dt);
  const busy=tg.state!=="idle"&&tg.state!=="cool";
  // Facing: turns slowly toward you, but holds still once it has aimed so the shot can be dodged (it keeps turning while it has you stuck).
  if(alive&&(!busy||tg.state==="stuck")){const da=((angleTo(b.pos,p.pos)-b.angle+540)%360)-180,turn=(tg.state==="stuck"?60:75)*dt;b.angle+=clamp(da,-turn,turn);}
  // Walking: a slow wander like the Virus; stops while the tongue is out.
  if(busy)b.vel=mul(b.vel,Math.max(0,1-6*dt));
  else{b.wanderTimer-=dt;
    if(b.wanderTimer<=0){b.wanderTimer=1.6+Math.random()*1.6;const m=b.r+60;b.wanderTarget=V(m+Math.random()*(CFG.W-2*m),m+Math.random()*(CFG.H-2*m));}
    const d=sub(b.wanderTarget,b.pos);
    b.vel=len(d)>4?mul(norm(d),CFG.bossSpd*.6*G.speedMult*b.spdF*(1+CFG.bossStallSpeed*rage)):V(0,0);}
  b.pos=add(b.pos,mul(b.vel,dt));b.walk+=len(b.vel)*dt*.06;
  // Armoured body: touching it is deadly. Not checked while stuck - that ends at the mouth.
  if(alive&&tg.state!=="stuck"){const cp=tardiBody(b),q=segClosest(p.pos,cp.a,cp.b),d=dist(p.pos,q);
    if(d<cp.r+p.r&&p.invuln<=0)damagePlayer();} // touching the armoured body is fatal
  // Tongue
  const mouth=tardiMouth(b);
  if(tg.state==="idle"||tg.state==="cool"){
    tg.timer-=dt;if(tg.state==="cool"&&tg.timer<=0){tg.state="idle";tg.timer=0;}
    if(tg.state==="idle"&&tg.timer<=0&&alive){
      const da=Math.abs(((angleTo(b.pos,p.pos)-b.angle+540)%360)-180);
      if(da<22&&dist(mouth,p.pos)<CFG.tardiReach*.95){tg.state="windup";tg.timer=Math.max(.35,CFG.tardiWind/(1+.1*(b.n-1)));tg.len=0;tg.dir=fwd(b.angle);Snd.tongueWind(b.pos.x);}}
  }else if(tg.state==="windup"){
    tg.len=10+3*Math.sin(G.frame*.8);tg.dir=fwd(b.angle);tg.timer-=dt;
    if(tg.timer<=0){tg.state="out";tg.len=0;tg.fast=false;tg.dir=alive?norm(sub(p.pos,mouth)):fwd(b.angle);Snd.tongueShoot(b.pos.x);}
  }else if(tg.state==="out"){
    tg.len+=CFG.tardiShoot*b.tf*dt;
    if(alive&&p.invuln<=0&&segDist(p.pos,mouth,add(mouth,mul(tg.dir,tg.len)))<=p.r+CFG.tardiW/2+2){
      tg.state="stuck";tg.hits=0;tg.pull=Math.max(140,dist(mouth,p.pos)/b.reel);Snd.tongueStick(b.pos.x);}
    else if(tg.len>=CFG.tardiReach){tg.len=CFG.tardiReach;tg.state="hold";tg.timer=.2;}
  }else if(tg.state==="hold"){
    tg.timer-=dt;if(tg.timer<=0){tg.state="retract";tg.fast=false;}
  }else if(tg.state==="stuck"){
    if(!alive){tg.state="retract";tg.fast=true;}
    else{
      const dm=dist(mouth,p.pos);
      if(tg.hits>=b.grip||dm>CFG.tardiReach*1.3){tg.state="retract";tg.fast=true;tg.extra=1;} // broken free (or yanked out of reach)
      else{
        const dir=norm(sub(mouth,p.pos));p.pos=add(p.pos,mul(dir,tg.pull*dt));tg.len=dm;
        if(dist(mouth,p.pos)<=p.r+16){tg.state="retract";tg.fast=true;tg.extra=1;if(p.invuln<=0)damagePlayer();} // reeled all the way in
      }}
  }
  if(tg.state==="retract"){
    tg.len-=CFG.tardiRetract*(tg.fast?1.6:1)*b.tf*dt;
    if(tg.len<=0){tg.len=0;tg.state="cool";tg.timer=CFG.tardiCd/b.tf/(1+rage*.8)+(tg.extra||0);tg.extra=0;}
  }
  b.mineTimer-=dt;
  if(b.mineTimer<=0){b.mineTimer=CFG.bossMineCd/Math.max(1,G.speedMult*.5);
    b.pendingMine=newMine(add(b.pos,V((Math.random()*2-1)*30,30)),"boss");b.pendingMine.look="tardi";b.pendingMine.home=Math.min(CFG.tardiMineSpd+CFG.tardiMineStep*(b.n-1),CFG.tardiMineMax);}
}
// ---- Amoeba boss ----
function tentGeom(b,t){const o=add(b.pos,mul(fwd(t.ang),b.r*.55));return{a:o,b:add(o,mul(fwd(t.ang),t.len))};}
function segDist(p,a,b){const abx=b.x-a.x,aby=b.y-a.y,l2=abx*abx+aby*aby||1;
  const u=clamp(((p.x-a.x)*abx+(p.y-a.y)*aby)/l2,0,1);return Math.hypot(p.x-(a.x+abx*u),p.y-(a.y+aby*u));}
function tentHit(b,pt,rad){for(let i=0;i<b.tents.length;i++){const t=b.tents[i];if(t.len<=2)continue;
  const g=tentGeom(b,t);if(segDist(pt,g.a,g.b)<=rad+CFG.tentW/2)return i;}return -1;}
function retractTent(b,i){const t=b.tents[i];if(t.state==="idle"||(t.state==="retract"&&t.fast))return;
  t.state="retract";t.fast=true;Snd.tentacleHit(b.pos.x);} // a shot just yanks it back in - no damage; a fresh one launches soon after
function updateAmoebaBoss(b,dt){
  const p=G.player,alive=p.alive,rage=G.bossRage;
  // Movement: the same hop-to-a-point style as the Virus, but every hop is toward you (stopping short so the tentacles can work), then sidestepping while close.
  b.wanderTimer-=dt;
  if(b.wanderTimer<=0){b.wanderTimer=1.3+Math.random()*1.2;const m=b.r+30;let t=b.pos;
    if(alive){const d=sub(p.pos,b.pos),dd=len(d),stand=b.r+170;
      if(dd>stand+40)t=add(b.pos,mul(norm(d),Math.min(dd-stand,150+Math.random()*130)));
      else{const side=norm(V(-d.y,d.x));t=add(b.pos,mul(side,(Math.random()<.5?-1:1)*(110+Math.random()*80)));}}
    b.wanderTarget=V(clamp(t.x,m,CFG.W-m),clamp(t.y,m,CFG.H-m));}
  const dv=sub(b.wanderTarget,b.pos),spd=CFG.bossSpd*.8*G.speedMult*b.spdF*(1+CFG.bossStallSpeed*rage);
  const want=len(dv)>4?mul(norm(dv),spd):V(0,0);
  b.vel=add(b.vel,mul(sub(want,b.vel),Math.min(1,dt*2.5))); // eases in and out - blobby, not mechanical
  b.pos=add(b.pos,mul(b.vel,dt));
  if(alive)b.angle=angleTo(b.pos,p.pos);
  // Tentacles: launched aimed at you, extend slowly while gently steering, hold a moment, then pull back on their own.
  const tspd=CFG.tentSpd*b.tentF*(1+CFG.bossStallSpeed*rage);
  let active=0;for(const t of b.tents)if(t.state==="out"||t.state==="hold")active++;
  for(const t of b.tents){
    if(t.state==="idle"){t.timer-=dt;
      if(alive&&(t.timer<=0||active<b.minActive)){
        t.state="out";t.len=0;t.fast=false;t.held=0;t.max=CFG.tentMax*(.8+Math.random()*.4);
        t.ang=angleTo(b.pos,p.pos)+(Math.random()*2-1)*14;active++;Snd.tentacleLaunch(b.pos.x);}
    }else if(t.state==="out"||t.state==="hold"){
      if(alive){const da=((angleTo(b.pos,p.pos)-t.ang+540)%360)-180,turn=CFG.tentTurn*dt;t.ang+=clamp(da,-turn,turn);}
      if(t.state==="out"){t.len+=tspd*dt;if(t.len>=t.max){t.len=t.max;t.state="hold";t.timer=.5;}}
      else{t.timer-=dt;t.held=(t.held||0)+dt;if(t.timer<=0&&(active>b.minActive||t.held>=4)){t.state="retract";active--;}}
    }else{ // retract
      t.len-=tspd*(t.fast?7:2.2)*dt;
      if(t.len<=0){t.len=0;t.state="idle";t.timer=(t.fast?.3:.5+Math.random()*.7)/(1+rage);}
    }
  }
  b.mineTimer-=dt;
  if(b.mineTimer<=0){b.mineTimer=CFG.bossMineCd/Math.max(1,G.speedMult*.5);
    b.pendingMine=newMine(add(b.pos,V((Math.random()*2-1)*30,30)),"boss");b.pendingMine.look="amoeba";} // still a "boss" mine (so it homes at higher tiers like the Virus's), but drawn as a little amoeba
}
function updateBoss(b,dt){
  b.pendingMine=null;b.laserHitPlayer=false;
  updateBossRage(b,dt);
  if(b.kind==="amoeba"){updateAmoebaBoss(b,dt);return;}
  if(b.kind==="tardigrade"){updateTardigradeBoss(b,dt);return;}
  b.wanderTimer-=dt;
  if(b.wanderTimer<=0){b.wanderTimer=1.6+Math.random()*1.6;const m=b.r+60;
    b.wanderTarget=V(m+Math.random()*(CFG.W-2*m),m+Math.random()*(CFG.H-2*m));}
  const d=sub(b.wanderTarget,b.pos);
  b.vel=len(d)>4?mul(norm(d),CFG.bossSpd*G.speedMult*(1+CFG.bossStallSpeed*G.bossRage)):V(0,0);
  b.pos=add(b.pos,mul(b.vel,dt));
  if(G.player.alive)b.angle=angleTo(b.pos,G.player.pos);

  b.laserTimer-=dt;
  if(b.laserState==="idle"){
    if(b.laserTimer<=0){b.laserState="warn";b.laserTimer=CFG.laserWarn;
      if(G.player.alive){const dd=sub(G.player.pos,b.pos);b.laserDir=len(dd)>1?norm(dd):V(0,1);}}
  }else if(b.laserState==="warn"){
    if(b.laserTimer<=0){b.laserState="firing";b.laserTimer=CFG.laserFire;b.laserTick=0;}
  }else if(b.laserState==="firing"){
    b.laserTick-=dt;
    if(b.laserTick<=0){b.laserTick=CFG.laserTick;
      if(G.player.alive&&laserHits(b,G.player.pos))b.laserHitPlayer=true;}
    if(b.laserTimer<=0){b.laserState="cooldown";b.laserTimer=CFG.laserCd/Math.max(1,G.speedMult*.6)*(1-CFG.bossStallLaser*G.bossRage);}
  }else if(b.laserState==="cooldown"){
    if(b.laserTimer<=0){b.laserState="idle";b.laserTimer=1+Math.random();}
  }
  b.mineTimer-=dt;
  if(b.mineTimer<=0){b.mineTimer=CFG.bossMineCd/Math.max(1,G.speedMult*.5);
    b.pendingMine=newMine(add(b.pos,V((Math.random()*2-1)*30,30)),"boss");}
}
function laserHits(b,pt,w=CFG.laserW){const to=sub(pt,b.pos),proj=to.x*b.laserDir.x+to.y*b.laserDir.y;
  if(proj<0)return false;const closest=add(b.pos,mul(b.laserDir,proj));return dist(pt,closest)<=w/2;}

function updateBossLaserSound(){
  if(G.state!=="playing")return;
  const st=G.boss?G.boss.laserState:null;
  if(st!==G.prevLaserState){
    if(st==="warn")Snd.laserWarnBeep();
    if(st==="firing")Snd.laserLoopStart();
    else if(G.prevLaserState==="firing")Snd.laserLoopStop();
  }
  G.prevLaserState=st;
}

function explodeMissile(m){if(!m.alive)return;m.alive=false;m.exploded=true;
  if(G.player.activeMs===m)G.player.activeMs=null;
  spawnExplosion(m.pos,CFG.blastR,"missile");}

// Bullet/missile damage to the boss is a fraction of its (HP-cap-capped) max
// HP rather than a flat number, so a hit always visibly moves the health bar
// and the "bullets-only" kill time stays roughly constant across every tier
// instead of eroding as HP climbs. See bossBulletDmg()/bossMissileDmg().
function bossBulletDmg(){return Math.max(1,Math.round(G.boss.maxHp*CFG.bulDmgBossFrac));}
function bossMissileDmg(){return Math.max(1,Math.round(G.boss.maxHp*CFG.msDmgBossFrac));}
function spawnExplosion(pos,radius,src){
  G.explosions.push(newExplosion(pos,radius));
  src==="missile"?Snd.explMissile(pos.x):Snd.explMine(pos.x);
  for(const e of G.enemies)if(e.alive&&dist(e.pos,pos)<=radius+e.r)if(hitEnemy(e,99))killEnemy(e);
  for(const mn of G.mines)if(mn.alive&&dist(mn.pos,pos)<=radius+mn.r)if(hitMine(mn))killMine(mn);
  if(G.boss&&G.boss.alive&&G.boss.kind==="tardigrade"&&src==="missile"&&G.boss.tongue.len>2){const B=G.boss;
    if(segDist(pos,tardiMouth(B),tardiTip(B))<=radius+CFG.tardiW/2){if(B.tongue.state==="stuck")B.tongue.hits=B.grip;hitTongue(B,bossMissileDmg());}} // a blast on the tongue is the only way a missile hurts it
  if(G.boss&&G.boss.alive&&G.boss.kind!=="tardigrade"&&dist(G.boss.pos,pos)<=radius+G.boss.r)
    if(hitBoss(G.boss,src==="missile"?bossMissileDmg():bossBulletDmg()*5))killBoss();
  if(G.boss&&G.boss.alive&&G.boss.kind==="amoeba")for(let i=0;i<G.boss.tents.length;i++){const t=G.boss.tents[i];if(t.len<=2)continue;
    const g=tentGeom(G.boss,t);if(segDist(pos,g.a,g.b)<=radius+CFG.tentW/2)retractTent(G.boss,i);} // blasts pull tentacles back too
  if(src==="missile"&&G.player.alive&&!G.player.invuln&&dist(G.player.pos,pos)<=radius+G.player.r)damagePlayer();
}
function hitEnemy(e,dmg){e.hp-=dmg;return e.hp<=0;}
function hitMine(m){m.hp-=1;return m.hp<=0;}
function hitBoss(b,dmg){b.hp-=dmg;G.bossIdle=0;G.bossRage=0;return b.hp<=0;} // any damage calms the boss back down (see updateBossRage)
function addScore(n){
  const before=G.score;G.score+=n;
  if(Math.floor(G.score/CFG.extraLifeScore)>Math.floor(before/CFG.extraLifeScore)){
    G.lives++;G.extraLifeFlash=1.6;Snd.bugle();
  }
}
function killEnemy(e,award=true){e.alive=false;G.explosions.push(newExplosion(e.pos,e.r*2.2));Snd.explSmall(e.pos.x);
  if(award){if(e.kind==="kami")addScore(CFG.scK);else if(e.kind==="gun")addScore(CFG.scG);else addScore(CFG.scM);}}
function killMine(m){m.alive=false;G.explosions.push(newExplosion(m.pos,m.r*2.5));Snd.explSmall(m.pos.x);addScore(CFG.scMine);}
function killBoss(){
  const bp=V(G.boss.pos.x,G.boss.pos.y),br=G.boss.r,tier=G.boss.tier;
  if(tier%2===0)G.pendingBonusTier=tier; // every 2nd tier's boss kicks off a bonus round, consumed when levelclear ends
  G.boss.alive=false;
  const rings=6;
  for(let i=0;i<rings;i++){
    const off=V((Math.random()*2-1)*br*0.6,(Math.random()*2-1)*br*0.6);
    const r=br*(1.4+Math.random()*2.2),life=.5+Math.random()*.9;
    G.explosions.push(newExplosion(add(bp,off),r,life));
  }
  G.explosions.push(newExplosion(bp,br*1.15,.22));
  G.debris=G.debris.concat(newDebrisField(bp,CFG.bossDebris));
  G.bossDeathPending=true;G.bossDeathTimer=CFG.bossFinalDelay;G.bossDeathPos=bp;G.bossDeathRadius=br;
  G.hitstopTimer=CFG.bossHitstop;G.shakeMag=Math.max(G.shakeMag,CFG.bossShake);
  Snd.laserLoopStop();Snd.explBoss(bp.x);
  addScore(CFG.scBoss);G.boss=null;
}
// UI input lockout: after a death the fire button is usually held or being mashed, so for a short time the end-of-run screens ignore
// FIRE/START, and FIRE must be released and pressed again before it counts - otherwise GAME OVER flashes by straight to the title.
function lockUi(sec){G.uiLock=sec;G.needRelease=true;}
function uiReady(inp,dt){
  if(G.uiLock>0)G.uiLock-=dt;
  if(!inp.fire)G.needRelease=false;
  return !(G.uiLock>0)&&!G.needRelease;
}
function damagePlayer(){const p=G.player;if(!p.alive||p.invuln>0)return;
  G.explosions.push(newExplosion(p.pos,p.r*2.5));Snd.explPlayer(p.pos.x);p.alive=false;
  p.thrusting=false;Snd.thrustStop();G.lives--;
  G.stallTimer=0;G.stallActive=false; // dying calms enraged parasites - the 30s clock starts over once you're back
  G.respawnTimer=CFG.respawnT;
  if(G.lives<0){
    Snd.laserLoopStop();G.prevLaserState=null;Snd.flatline();
    if(qualifiesForHighScore(G.score)){
      G.state="hsintro";G.hsIntroTimer=2.0;G.pendingScore=G.score;G.initials=["A","A","A"];G.initialsIdx=0;
      // hsIntroTimer is long enough for the flatline tone; the fanfare plays as this beat ends
      // clear every enemy/hazard off-screen so just the background and the player's
      // own explosion remain visible for this beat - the explosion itself (pushed
      // above) and any debris are left alone so they can finish animating.
      G.enemies=[];G.mines=[];G.bullets=[];G.missiles=[];G.boss=null;
    }else{G.state="gameover";G.gameOverAnimTime=0;lockUi(2.0);}
  }}

function handleCollisions(){
  const p=G.player;
  for(const b of G.bullets){
    if(!b.alive||b.owner!=="player")continue;
    for(const e of G.enemies)if(e.alive&&dist(b.pos,e.pos)<=b.r+e.r){b.alive=false;if(hitEnemy(e,1))killEnemy(e);break;}
    if(!b.alive)continue;
    for(const mn of G.mines)if(mn.alive&&dist(b.pos,mn.pos)<=b.r+mn.r){b.alive=false;if(hitMine(mn))killMine(mn);break;}
    if(!b.alive)continue;
    if(G.boss&&G.boss.alive&&G.boss.kind==="amoeba"&&dist(b.pos,G.boss.pos)>G.boss.r){const ti=tentHit(G.boss,b.pos,b.r);if(ti>=0){b.alive=false;retractTent(G.boss,ti);}}
    if(!b.alive)continue;
    if(G.boss&&G.boss.alive&&G.boss.kind==="tardigrade"){const B=G.boss;
      if(tongueHit(B,b.pos,b.r)){b.alive=false;hitTongue(B,bossBulletDmg()*CFG.tardiTongueDmg);}
      else{const cp=tardiBody(B);if(segDist(b.pos,cp.a,cp.b)<=cp.r+b.r){b.alive=false;G.explosions.push(newExplosion(b.pos,7,.14));Snd.tardiPing(b.pos.x);}} // body: shots just ping off
    }
    if(!b.alive)continue;
    if(G.boss&&G.boss.alive&&G.boss.kind!=="tardigrade"&&dist(b.pos,G.boss.pos)<=b.r+G.boss.r){b.alive=false;if(hitBoss(G.boss,bossBulletDmg()))killBoss();}
  }
  if(p.alive&&p.invuln<=0){
    for(const b of G.bullets)if(b.alive&&b.owner==="enemy"&&dist(b.pos,p.pos)<=b.r+p.r){b.alive=false;damagePlayer();}
  }
  for(const m of G.missiles){
    if(!m.alive)continue;let hit=false;
    for(const e of G.enemies)if(e.alive&&dist(m.pos,e.pos)<=m.r+e.r){hit=true;break;}
    if(!hit)for(const mn of G.mines)if(mn.alive&&dist(m.pos,mn.pos)<=m.r+mn.r){hit=true;break;}
    if(!hit&&G.boss&&G.boss.alive&&G.boss.kind!=="tardigrade"&&dist(m.pos,G.boss.pos)<=m.r+G.boss.r)hit=true;
    if(!hit&&G.boss&&G.boss.alive&&G.boss.kind==="tardigrade"){const cp=tardiBody(G.boss);if(segDist(m.pos,cp.a,cp.b)<=cp.r+m.r||tongueHit(G.boss,m.pos,m.r))hit=true;}
    if(!hit&&G.boss&&G.boss.alive&&G.boss.kind==="amoeba"&&tentHit(G.boss,m.pos,m.r)>=0)hit=true;
    if(hit)explodeMissile(m);
  }
  if(p.alive&&p.invuln<=0){
    for(const e of G.enemies){
      if(e.alive&&dist(e.pos,p.pos)<=e.r+p.r){
        if(e.kind==="kami")killEnemy(e,false);
        damagePlayer();break;
      }
    }
    if(p.alive&&p.invuln<=0){
      for(const mn of G.mines){
        if(mn.alive&&mn.arm<=0&&dist(mn.pos,p.pos)<=mn.r+p.r){
          mn.alive=false;spawnExplosion(mn.pos,CFG.blastR*.6,"mine");damagePlayer();break;
        }
      }
    }
    if(p.alive&&p.invuln<=0&&G.boss&&G.boss.alive&&G.boss.kind!=="tardigrade"&&dist(G.boss.pos,p.pos)<=G.boss.r+p.r)damagePlayer();
    if(p.alive&&p.invuln<=0&&G.boss&&G.boss.alive&&G.boss.kind==="amoeba"&&tentHit(G.boss,p.pos,p.r)>=0)damagePlayer();
  }
}
function cleanup(){
  G.bullets=G.bullets.filter(o=>o.alive);G.missiles=G.missiles.filter(o=>o.alive);
  G.mines=G.mines.filter(o=>o.alive);G.enemies=G.enemies.filter(o=>o.alive);
}
function tickEffects(dt){
  for(const ex of G.explosions){ex.life-=dt;if(ex.life<=0)ex.alive=false;}
  for(const d of G.debris){
    d.pos=add(d.pos,mul(d.vel,dt));d.vel=mul(d.vel,Math.max(0,1-1.2*dt));
    d.angle+=d.spin*dt;d.life-=dt;if(d.life<=0)d.alive=false;
  }
  G.explosions=G.explosions.filter(o=>o.alive);
  G.debris=G.debris.filter(o=>o.alive);
  if(G.bossDeathPending){
    G.bossDeathTimer-=dt;
    if(G.bossDeathTimer<=0){
      G.bossDeathPending=false;
      G.explosions.push(newExplosion(G.bossDeathPos,G.bossDeathRadius*4,.6));
      G.shakeMag=Math.max(G.shakeMag,CFG.bossFinalShake);
      Snd.explBossFinal(G.bossDeathPos.x);
    }
  }
  if(G.shakeMag>0)G.shakeMag=Math.max(0,G.shakeMag-dt*70);
  if(G.extraLifeFlash>0)G.extraLifeFlash=Math.max(0,G.extraLifeFlash-dt);
  if(G.stallFlash>0)G.stallFlash=Math.max(0,G.stallFlash-dt);
}
function checkLevelClear(){
  if(G.state!=="playing")return;
  if(!G.boss&&G.enemies.length===0&&G.mines.length===0){
    G.state="levelclear";G.levelClearTimer=2.2;addScore(100*G.level);
    G.player.thrusting=false;Snd.thrustStop();
  }
}

// ---------- bonus round ----------
// A no-risk "shooting gallery" challenge stage, in the spirit of Galaga's
// challenge stage: fires right after every 2nd tier's boss kill (see killBoss()).
// CFG.bonusWaves waves of CFG.bonusSquadron targets each, one pathogen kind per round, flown
// in scripted formation paths (not the normal enemy AI). Contact never costs a
// life - it's pure bonus score, plus a missile reward for a wave with zero
// escapes. Missiles sit out the round entirely (see updateBonusWave) so it
// stays a pure-bullet precision/speed test.
function startBonusRound(){
  const tier=G.pendingBonusTier;G.pendingBonusTier=0;
  const roundIndex=tier/2; // tier is always even here (see killBoss), so this is 1,2,3...
  // Each wave flies two different pathogen kinds alternating along the line, and the
  // pair changes every wave: shuffle all 6 possible pairs of the 4 kinds and deal one per wave.
  const kinds=["kami","gun","mine","amoeba","worm","flu","tardi"],combos=[];
  for(let i=0;i<kinds.length;i++)for(let j=i+1;j<kinds.length;j++)combos.push([kinds[i],kinds[j]]);
  for(let i=combos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[combos[i],combos[j]]=[combos[j],combos[i]];}
  const wavePairs=[];for(let w=0;w<CFG.bonusWaves;w++)wavePairs.push(combos[w%combos.length]);
  G.bullets=[];G.missiles=[];
  const keepMs=G.player.msLeft;
  respawnPlayer(G.player,V(CFG.W/2,CFG.H/2));
  G.player.msLeft=keepMs;
  G.bonus={tier,roundIndex,wavePairs,waveIndex:0,wave:null,
    totalKilled:0,totalEscaped:0,missilesEarned:0,
    introTimer:CFG.bonusIntroTime,resultTimer:0,finalTimer:0,
    returnLevel:G.level+1};
  G.state="bonusintro";
  Snd.bonusCharge();
}
function startBonusWave(idx){
  const durMult=Math.max(CFG.bonusDurMinMult,1-CFG.bonusDurStep*(G.bonus.roundIndex-1));
  const pathDur=CFG.bonusBaseDur*durMult;
  // Two different patterns fly at once: every other target belongs to the second pattern, so you can't cover both from the centre.
  const all=["loop","zig","split"];const pa=all[idx%3],pb=all.filter(x=>x!==pa)[Math.floor(Math.random()*2)];
  const pattern=pa;let params={};
  // Single file: every target in a wave follows the same lane/path, so the lane
  // and loop direction are picked once per wave here rather than per target.
  const genParams=(pt,zone)=>{const q={}; // zone 0/1 = the two halves of the screen: each pattern works its own half, so no single spot covers both
    if(pt==="loop"){q.side=Math.random()<.5?"L":"R";q.laneY=230+Math.random()*290;q.amp=CFG.bonusLoopAmp*(Math.random()<.5?1:-1);}
    else if(pt==="zig"){q.side=Math.random()<.5?"T":"B";q.exitSide=Math.random()<.5?"L":"R";q.laneX=300+Math.random()*400;}
    else{ // split: 4 off-screen corners; opposite = diagonal mirror, branch = same-row other column
      const corners=[V(-40,-40),V(CFG.W+40,-40),V(-40,CFG.H+40),V(CFG.W+40,CFG.H+40)]; // TL,TR,BL,BR
      const ci=Math.floor(Math.random()*4);
      Object.assign(q,{corner:corners[ci],opp:corners[3-ci],branch:corners[ci^1],cx:CFG.W/2,cy:CFG.H/2});}
    return q;};
  const zA=Math.random()<.5?0:1;params=genParams(pattern,zA);const paramsB=genParams(pb,1-zA);
  G.bonus.waveIndex=idx;
  G.bonus.wave={pattern,params,patternB:pb,paramsB,kinds:G.bonus.wavePairs[idx],pathDur,spawned:0,spawnTimer:0,killed:0,escaped:0,targets:[]};
  G.player.pos=V(CFG.W/2,CFG.H/2);G.player.vel=V(0,0); // recenter for each fresh wave
  G.state="bonuswave";
}
// Position for a bonus target at its own path-local progress t (0..1). Each
// target carries everything its pattern needs (set up in makeBonusTarget), so
// this is a pure function of t - no physics, just scripted motion.
function bonusPatternPos(tg,t){
  t=clamp(t,0,1);const o=tg.offset;
  if(tg.pat==="loop"){
    const x=tg.x0+(tg.x1-tg.x0)*t;
    const y=tg.laneY+Math.sin(t*Math.PI)*tg.amp;
    return V(x+o.x,y+o.y);
  }
  if(tg.pat==="zig"){
    if(t<=.55){
      const u=t/.55;
      const x=tg.laneX+Math.sin(u*Math.PI*tg.zigCount)*tg.zigAmp;
      const y=tg.entryY+(tg.centerY-tg.entryY)*u;
      return V(x+o.x,y+o.y);
    }else{
      const u=(t-.55)/.45;
      const x=tg.laneX+(tg.exitX-tg.laneX)*u;
      return V(x+o.x,tg.centerY+o.y);
    }
  }
  // split
  if(t<=.5){
    const u=t/.5;
    return V(tg.x0+(tg.cx-tg.x0)*u+o.x,tg.y0+(tg.cy-tg.y0)*u+o.y);
  }
  const u=(t-.5)/.5,ex=tg.group==="A"?tg.oppX:tg.branchX,ey=tg.group==="A"?tg.oppY:tg.branchY;
  return V(tg.cx+(ex-tg.cx)*u+o.x,tg.cy+(ey-tg.cy)*u+o.y);
}
function makeBonusTarget(w,off,group){
  const second=w.spawned%2===1,pattern=second?w.patternB:w.pattern,prm=second?w.paramsB:w.params,laneY=prm.laneY,laneX=prm.laneX;
  const base={kind:w.kinds[w.spawned%2],alive:true,t:0,dur:w.pathDur,animSeed:Math.random()*1000,angle:0};
  if(pattern==="loop"){
    const side=prm.side;
    Object.assign(base,{pat:"loop",x0:side==="L"?-40:CFG.W+40,x1:side==="L"?CFG.W+40:-40,
      laneY,amp:prm.amp,offset:V(0,off)});
  }else if(pattern==="zig"){
    const side=prm.side,exitSide=prm.exitSide;
    Object.assign(base,{pat:"zig",laneX,entryY:side==="T"?-40:CFG.H+40,centerY:CFG.H/2,
      exitX:exitSide==="L"?-40:CFG.W+40,zigCount:CFG.bonusZigCount,zigAmp:CFG.bonusZigAmp,offset:V(off,0)});
  }else{
    const c=prm.corner,opp=prm.opp,branch=prm.branch;
    Object.assign(base,{pat:"split",cx:prm.cx,cy:prm.cy,x0:c.x,y0:c.y,oppX:opp.x,oppY:opp.y,branchX:branch.x,branchY:branch.y,
      group,offset:V(off*.7,off*.7)});
  }
  base.pos=bonusPatternPos(base,0);base.prevPos=base.pos;
  return base;
}
function spawnBonusTarget(w){
  const group=(w.spawned>>1)%2===0?"A":"B"; // alternates so half of each split-pattern group takes each exit
  w.targets.push(makeBonusTarget(w,0,group));
  w.spawned++;
}
function bonusWaveDone(w){return w.spawned>=CFG.bonusSquadron&&w.targets.every(tg=>!tg.alive);}
function updateBonusWave(dt,inp){
  const w=G.bonus.wave;
  const inp2=Object.assign({},inp,{missilePressed:false}); // missiles sit out the bonus round
  if(G.player.alive)updatePlayerShip(dt,inp2);
  for(const b of G.bullets){b.pos=wrap(add(b.pos,mul(b.vel,dt)));b.life-=dt;if(b.life<=0)b.alive=false;}
  G.bullets=G.bullets.filter(o=>o.alive);
  w.spawnTimer-=dt;
  if(w.spawnTimer<=0&&w.spawned<CFG.bonusSquadron){spawnBonusTarget(w);w.spawnTimer=CFG.bonusSpawnGap;}
  for(const tg of w.targets){
    if(!tg.alive)continue;
    tg.prevPos=tg.pos;tg.t+=dt/tg.dur;
    if(tg.t>=1){tg.alive=false;w.escaped++;continue;}
    tg.pos=bonusPatternPos(tg,tg.t);
    const d=sub(tg.pos,tg.prevPos);if(len(d)>.5)tg.angle=Math.atan2(d.y,d.x)*180/Math.PI;
  }
  for(const b of G.bullets){
    if(!b.alive||b.owner!=="player")continue;
    for(const tg of w.targets){
      if(tg.alive&&dist(b.pos,tg.pos)<=b.r+BONUS_R[tg.kind]){
        b.alive=false;tg.alive=false;w.killed++;addScore(CFG.bonusScorePer);
        G.explosions.push(newExplosion(tg.pos,BONUS_R[tg.kind]*2.2));Snd.explSmall(tg.pos.x);
        break;
      }
    }
  }
  if(bonusWaveDone(w)){
    G.bonus.totalKilled+=w.killed;G.bonus.totalEscaped+=w.escaped;
    w.earnedMissile=w.killed>=Math.ceil(CFG.bonusSquadron*CFG.bonusMissilePct);
    if(w.earnedMissile){G.player.msLeft++;G.bonus.missilesEarned++;}
    G.player.thrusting=false;Snd.thrustStop(); // the wave is over - stop the engine sound
    G.player.pos=V(CFG.W/2,CFG.H-90);G.player.vel=V(0,0); // step out of the way of the center-screen result text
    G.state="bonuswaveresult";G.bonus.resultTimer=CFG.bonusWaveResultTime;
  }
}
